  // Séance
  function vSeance() {
    const r = S.run; const s = r.s; const item = currentItem();
    if (!item) return vAccueil();
    const pct = Math.round((s.index / s.items.length) * 100);
    let head = '<header class="top"><button class="iconbtn" data-a="quit" aria-label="Quitter la séance (elle sera reprise plus tard)">' + ICON.close + '</button>' +
      '<div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="' + s.items.length + '" aria-valuenow="' + s.index + '"><i style="width:' + pct + '%"></i></div>' +
      '<span class="count">' + (s.index + 1) + ' / ' + s.items.length + '</span></header>';
    let body = '';
    if (item.k === 'carte') body = vCarte(item, r.ui);
    else if (item.k === 'vocab') body = vVocab(item, r.ui);
    else {
      const x = S.exercices[item.id];
      if (!x) { body = '<div class="card"><p>Cet exercice n\'existe plus.</p><button class="btn" data-a="skip">Passer</button></div>'; }
      else if (x.type === 'saisie') body = vSaisie(x, r.ui);
      else if (x.type === 'formes') body = vFormes(x, r.ui);
      else body = vQcm(x, r.ui);
    }
    return head + body;
  }

  function exoHeader(x) {
    const n = S.notions[x.notion] || {};
    const typeLabel = n.type === 'phonologie' ? 'Phonologie' : n.type === 'vocabulaire' ? 'Vocabulaire' : 'Grammaire';
    return '<div class="stack" style="gap:8px"><span class="tag">' + esc(typeLabel + ' · ' + (n.libelle || '') + ' · L' + lessonNum(x.lecon)) + '</span><h2 class="prompt">' + esc(x.consigne) + '</h2></div>';
  }
  function stage(x) {
    if (!x.enonce && !x.traduction) return '';
    let html = '<div class="stage">';
    if (x.enonce && x.type !== 'formes') {
      const nav = !x.enfr;
      html += '<span class="big' + (nav ? '' : ' fr') + '"' + (nav ? ' lang="art-x-navi"' : '') + '>' + esc(x.enonce) + '</span>';
    }
    if (x.traduction) html += '<span class="gloss">' + esc(x.traduction) + '</span>';
    return html + '</div>';
  }

  function vQcm(x, ui) {
    const fb = ui.phase === 'feedback';
    const allNavi = !!x.nv;
    const long = x.options.some((o) => o.t.length > 16);
    const opts = ui.order.map((i) => {
      const o = x.options[i];
      let cls = 'opt' + (allNavi ? ' nvopt' : '');
      let ic = '';
      if (fb) {
        if (i === x.bonne) { cls += ' good'; ic = ICON.check; }
        else if (i === ui.pick) { cls += ' bad'; ic = ICON.cross; }
        else cls += ' dim';
      }
      return '<button class="' + cls + '"' + (allNavi ? ' lang="art-x-navi"' : '') + ' data-a="pick" data-v="' + i + '"' + (fb ? ' disabled' : '') + '>' + ic + esc(o.t) + '</button>';
    }).join('');
    return exoHeader(x) + stage(x) + '<div class="options' + (long ? ' long' : '') + '" role="group" aria-label="Propositions">' + opts + '</div>' + (fb ? vFeedback(x) : '');
  }

  function charbar() {
    return '<div class="charbar" role="group" aria-label="Caractères spéciaux"><button type="button" class="charbtn" data-ch="ì" aria-label="Insérer ì">ì</button><button type="button" class="charbtn" data-ch="ä" aria-label="Insérer ä">ä</button><button type="button" class="charbtn" data-ch="\'" aria-label="Insérer une apostrophe (coup de glotte)">\'</button></div>';
  }
  function answerField(ui, label) {
    const fb = ui.phase === 'feedback';
    return '<div class="field"><label for="answer">' + esc(label || 'Ta réponse') + '</label>' +
      '<input id="answer" class="answer" type="text" lang="art-x-navi" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done" value="' + esc(ui.text) + '"' + (fb ? ' readonly' : '') + ' placeholder="Écris la réponse…">' +
      (fb ? '' : charbar()) + '</div>';
  }
  function vSaisie(x, ui) {
    const fb = ui.phase === 'feedback';
    return exoHeader(x) + stage(x) + answerField(ui, x.phrase ? 'Ta phrase' : 'Ta réponse') +
      (fb ? vFeedback(x) : '<button class="btn" id="validate" data-a="validate"' + (ui.text.trim() ? '' : ' disabled') + '>Valider</button>');
  }
  function vVocab(item, ui) {
    const e = S.elements[item.id];
    const fb = ui.phase === 'feedback';
    return '<div class="stack" style="gap:8px"><span class="tag">' + esc('Vocabulaire · L' + lessonNum(e.lecon)) + '</span><h2 class="prompt">Écris ce mot en Na\'vi</h2></div>' +
      '<div class="stage"><span class="big fr">' + esc(e.fr) + '</span><span class="gloss">' + esc(e.categorie) + '</span></div>' +
      answerField(ui) + (fb ? vFeedback(null, e) : '<button class="btn" id="validate" data-a="validate"' + (ui.text.trim() ? '' : ' disabled') + '>Valider</button>');
  }
  function vFormes(x, ui) {
    const fb = ui.phase === 'feedback';
    let k = 0;
    const sentence = esc(x.enonce).replace(/___/g, () => {
      const i = k++; const f = ui.filled[i];
      return '<button class="slot' + (f != null ? ' filled' : '') + '" data-a="unslot" data-v="' + i + '"' + (fb ? ' disabled' : '') + ' aria-label="' + (f != null ? 'Retirer ' + esc(x.etiquettes[f]) : 'Case vide ' + (i + 1)) + '">' + (f != null ? esc(x.etiquettes[f]) : '&nbsp;') + '</button>';
    });
    const used = new Set(ui.filled.filter((v) => v != null));
    const bank = fb ? '' : '<div class="tagbank" role="group" aria-label="Formes proposées">' + ui.bank.map((i) => '<button data-a="slot" data-v="' + i + '" lang="art-x-navi"' + (used.has(i) ? ' disabled' : '') + '>' + esc(x.etiquettes[i]) + '</button>').join('') + '</div>';
    const full = ui.filled.every((v) => v != null);
    return exoHeader(x) + '<div class="stage"><p class="sentence" lang="art-x-navi">' + sentence + '</p>' + (x.traduction ? '<span class="gloss">' + esc(x.traduction) + '</span>' : '') + '</div>' + bank +
      (fb ? vFeedback(x) : '<button class="btn" data-a="validate"' + (full ? '' : ' disabled') + '>Valider</button>');
  }
  function vCarte(item, ui) {
    const e = S.elements[item.id];
    const front = item.dir === 'navi'
      ? '<span class="big" lang="art-x-navi">' + esc(e.navi) + '</span><span class="gloss">Que veut dire ce mot ?</span>'
      : '<span class="big fr">' + esc(e.fr) + '</span><span class="gloss">Comment dit-on en Na\'vi ?</span>';
    const back = '<span class="big" lang="art-x-navi">' + esc(e.navi) + (e.variantes ? ' <span class="gloss">(' + esc(e.variantes.join(', ')) + ')</span>' : '') + '</span><span class="big fr" style="font-size:20px">' + esc(e.fr) + '</span><span class="gloss">' + esc(e.categorie) + '</span>' + ecoute(e.navi);
    return '<div class="stack" style="gap:8px"><span class="tag">' + esc('Vocabulaire · L' + lessonNum(e.lecon)) + '</span><h2 class="prompt">' + (item.dir === 'navi' ? 'Carte : Na\'vi → français' : 'Carte : français → Na\'vi') + '</h2></div>' +
      '<div class="stage flipcard">' + (ui.flipped ? back : front) + '</div>' +
      (ui.flipped
        ? '<div class="options"><button class="opt" data-a="card" data-v="0">Je ne savais pas</button><button class="opt good" data-a="card" data-v="1">' + ICON.check + 'Je savais</button></div>'
        : '<button class="btn" data-a="flip">Retourner la carte</button>');
  }

  function vFeedback(x, mot) {
    const ui = S.run.ui; const v = ui.verdict;
    let html = '';
    if (v.ok) {
      html += '<div class="fb ok" role="status">' + ICON.okc + '<div class="stack"><strong>Juste !</strong>' + (x && x.explication ? '<span>' + esc(x.explication) + '</span>' : '') + '</div></div>';
    } else if (v.verdict === 'accent') {
      html += '<div class="fb ko" role="status">' + ICON.warnc + '<div class="stack"><strong>Presque : attention à l\'accent.</strong><span>On écrit ' + NV(v.attendu) + '. En Na\'vi, ì et i sont deux lettres différentes, comme ä et a.</span></div></div>';
    } else {
      // Écouter la réponse attendue quand c'est un seul mot en Na'vi (vocabulaire, saisie, QCM en Na'vi).
      const lien = (mot || (x && ((x.type === 'saisie' && !x.phrase) || (x.type === 'qcm' && x.nv)))) ? ecoute(mot ? mot.navi : v.attendu) : '';
      html += '<div class="fb ko" role="status">' + ICON.koc + '<div class="stack"><strong>Pas tout à fait.</strong><span>Réponse attendue : ' + NV(v.attendu) + (lien ? ' ' + lien : '') + '</span>' +
        (v.msg ? '<span>' + esc(v.msg) + '</span>' : '') + (x && x.explication && x.explication !== v.msg ? '<span>' + esc(x.explication) + '</span>' : '') +
        (v.added ? '<span class="small">Ajoutée au carnet : ' + esc(S.motifs[v.added].titre) + '</span>' : '') + '</div></div>';
    }
    if (!v.ok && x) {
      if (!ui.why) html += '<div class="row"><button class="btn-ghost" data-a="why">' + (S.sample ? 'Pourquoi ?' : 'Voir la règle') + '</button></div>';
      else if (ui.why.regle) {
        html += '<section class="why" aria-label="Règle"><span class="why-label">' + ICON.book + 'Règle « ' + esc(ui.why.titre) + ' »</span><div class="fiche-sec">' + regleCorps(S.elements[ui.why.regle]) + '</div></section>';
      } else {
        html += '<section class="why" aria-label="Explication"><span class="why-label">' + ICON.spark + 'Générée par Claude · règle « ' + esc(ui.why.titre) + ' »</span>' +
          '<p class="why-text" id="why-text">' + esc(ui.why.text || (ui.why.state === 'error' ? '' : 'Claude réfléchit…')) + '</p>' +
          (ui.why.state === 'error' ? '<p class="small" style="color:var(--warn-ink)">' + esc(ui.why.err) + '</p>' : '') + '</section>';
      }
    }
    if (ui.report === 'open') {
      html += '<div class="card"><label for="report-text"><b>Qu\'est-ce qui te semble faux ?</b></label><textarea id="report-text" placeholder="Par exemple : la réponse attendue me semble incorrecte."></textarea>' + avisTicket() + '<div class="row"><button class="btn-ghost" data-a="report-send">Envoyer</button><button class="btn-link" data-a="report-cancel">Annuler</button></div></div>';
    }
    html += '<div class="spread"><span></span>' + (ui.report === 'sent' ? '<span class="small muted">Signalé</span>' : ui.report === 'open' ? '' : '<button class="btn-link" data-a="report">Signaler une erreur de contenu</button>') + '</div>';
    html += '<button class="btn" data-a="next">' + (S.run.s.index + 1 >= S.run.s.items.length ? 'Voir le résultat' : 'Continuer') + ' ' + ICON.arrow + '</button>';
    return html;
  }

  // Résultats
  function vResultats() {
    const s = S.run && S.run.s;
    if (!s) return vAccueil();
    const pct = Math.round((s.bons / s.items.length) * 100);
    const misses = s.reponses.filter((r) => !r.ok).map((r) => s.items[r.i]);
    let verdict = '';
    if (s.mode === 'bilan') {
      verdict = s.valide ? '<div class="fb ok">' + ICON.okc + '<div class="stack"><strong>Leçon ' + lessonNum(s.lecon) + ' validée</strong><span>Tu as atteint le seuil de ' + (S.params.seuil || 80) + ' %.</span></div></div>'
        : pct >= (S.params.seuil || 80) ? '<div class="fb ok">' + ICON.okc + '<div class="stack"><strong>Bilan réussi</strong><span>Cette leçon était déjà validée.</span></div></div>'
        : '<div class="fb ko">' + ICON.warnc + '<div class="stack"><strong>Pas encore validée</strong><span>Il faut ' + (S.params.seuil || 80) + ' % de bonnes réponses. Retravaille tes erreurs puis repasse le bilan.</span></div></div>';
    }
    const list = misses.length ? '<section class="card"><h2>À revoir</h2>' + misses.map((it) => {
      if (it.k === 'exo') { const x = S.exercices[it.id]; return x ? '<div class="ex"><span class="small muted">' + esc(x.consigne) + (x.enonce && x.type !== 'formes' ? ' ' + esc(x.enonce) : '') + '</span><span>' + NV(displayAnswer(x)) + '</span></div>' : ''; }
      const e = S.elements[it.id]; return '<div class="ex"><span class="small muted">' + esc(e.fr) + '</span><span>' + NV(e.navi) + '</span></div>';
    }).join('') + '</section>' : '<p class="muted">Aucune erreur. Les éléments reviendront plus tard, à intervalle croissant.</p>';
    const tomorrow = addDays(today(), 1);
    const dueTomorrow = Object.values(S.revisions).filter((r) => r.echeance <= tomorrow).length;
    return '<header class="stack" style="gap:4px"><span class="eyebrow">' + esc(modeLabel(s)) + '</span><h1>Séance terminée</h1></header>' +
      '<section class="card" style="gap:12px"><div class="spread"><span class="score">' + s.bons + ' / ' + s.items.length + '</span><span class="muted">' + pct + ' %</span></div><div class="bar"><i style="width:' + pct + '%"></i></div>' +
      '<span class="small muted">' + plural(dueTomorrow, 'élément revient', 'éléments reviennent') + ' d\'ici demain.</span></section>' + verdict + list +
      (activeMotifs().length ? '<button class="btn-ghost" data-a="carnet-all">Retravailler mes erreurs actives</button>' : '') +
      '<button class="btn" data-a="home">Retour à l\'accueil</button>';
  }

  // Entraînement libre
  function vLibre() {
    const done = doneLessons();
    if (!S.libre) S.libre = { types: { voc: false, gram: true, pho: false }, lecons: done.map((l) => l.id), notions: Object.keys(S.notions).filter((n) => S.notions[n].type === 'grammaire'), count: 20, prio: true };
    const f = S.libre;
    const chip = (a, v, label, on, soft) => '<button class="chip' + (soft ? ' soft' : '') + '" data-a="' + a + '" data-v="' + v + '" aria-pressed="' + (on ? 'true' : 'false') + '">' + (on ? ICON.check : '') + esc(label) + '</button>';
    const gramNotions = Object.keys(S.notions).filter((n) => S.notions[n].type === 'grammaire' && f.lecons.includes(S.notions[n].lecon));
    const preview = countLibre(f);
    return top('Entraînement libre') +
      '<section class="stack" aria-labelledby="f-type"><h2 id="f-type" class="eyebrow">Type</h2><div class="chips">' +
      chip('ltype', 'voc', 'Vocabulaire', f.types.voc) + chip('ltype', 'gram', 'Grammaire', f.types.gram) + chip('ltype', 'pho', 'Phonologie', f.types.pho) + '</div></section>' +
      '<section class="stack" aria-labelledby="f-lec"><h2 id="f-lec" class="eyebrow">Leçons</h2><div class="chips">' +
      done.map((l) => chip('llec', l.id, 'L' + l.num, f.lecons.includes(l.id))).join('') + '</div><span class="small muted">Les leçons suivantes apparaissent après chaque cours.</span></section>' +
      '<section class="stack" aria-labelledby="f-not"><h2 id="f-not" class="eyebrow">Notions de grammaire</h2>' +
      (f.types.gram ? (gramNotions.length ? '<div class="chips">' + gramNotions.map((n) => chip('lnot', n, S.notions[n].libelle, f.notions.includes(n), true)).join('') + '</div>' : '<span class="small muted">Aucune notion de grammaire dans les leçons cochées.</span>') : '<span class="small muted">Coche « Grammaire » pour choisir des notions.</span>') + '</section>' +
      '<section class="stack" aria-labelledby="f-nb"><h2 id="f-nb" class="eyebrow">Nombre de questions</h2><div class="seg">' +
      [10, 20, 30].map((n) => '<button data-a="lcount" data-v="' + n + '" aria-pressed="' + (f.count === n) + '">' + n + '</button>').join('') + '</div></section>' +
      '<div class="row" style="flex-wrap:nowrap;min-height:44px"><input id="prio" type="checkbox" data-a="lprio" ' + (f.prio ? 'checked' : '') + ' style="width:22px;height:22px;accent-color:var(--accent);flex-shrink:0"><label for="prio">Placer mes erreurs actives en premier</label></div>' +
      '<p class="small muted">' + plural(preview, 'question disponible', 'questions disponibles') + ' avec ces filtres.</p>' +
      '<button class="btn" data-a="start-libre"' + (preview ? '' : ' disabled') + '>Lancer · ' + Math.min(f.count, preview) + ' questions ' + ICON.arrow + '</button>';
  }
  function countLibre(f) { return buildLibre(Object.assign({}, f, { count: 1000, prio: false })).length; }

  // Bilan
  function vBilan() {
    const done = doneLessons();
    const seuil = S.params.seuil || 80;
    return top('Bilan de leçon') + '<p class="muted">Jusqu\'à 18 questions sur toutes les notions d\'une leçon. La leçon est validée à partir de ' + seuil + ' % de bonnes réponses.</p>' +
      (done.length ? done.map((l) => {
        const b = lastBilan(l.id);
        return '<section class="card"><div class="spread"><span class="tag' + (l.statut === 'validee' ? '' : ' warn') + '">' + (l.statut === 'validee' ? 'Validée' : 'À valider') + '</span><span class="small muted">' + (b ? 'Dernier bilan : ' + b.score + ' % le ' + frDate(b.fin) : 'Jamais passé') + '</span></div>' +
          '<h2>Leçon ' + l.num + ' · ' + esc(l.titre) + '</h2><button class="btn-ghost" data-a="start-bilan" data-v="' + l.id + '">Passer le bilan</button></section>';
      }).join('') : '<p>Aucune leçon faite pour le moment.</p>');
  }

  // Fiches
  function vFiches() {
    const done = doneLessons();
    if (!done.length) return top('Fiches') + '<p>Aucune leçon faite pour le moment.</p>';
    if (!S.fiche.lecon || !isDone(S.fiche.lecon)) S.fiche.lecon = done[0].id;
    const l = Object.assign({ id: S.fiche.lecon }, S.lecons[S.fiche.lecon]);
    const t = S.fiche.type;
    const tabs = '<div class="chips" role="group" aria-label="Leçon">' + done.map((x) => '<button class="chip" data-a="fiche-lec" data-v="' + x.id + '" aria-pressed="' + (x.id === l.id) + '">L' + x.num + '</button>').join('') + '</div>';
    const types = '<div class="seg" role="group" aria-label="Type">' + [['tout', 'Tout'], ['vocabulaire', 'Vocabulaire'], ['grammaire', 'Grammaire'], ['phonologie', 'Phonologie']].map(([v, lab]) => '<button data-a="fiche-type" data-v="' + v + '" aria-pressed="' + (t === v) + '">' + lab + '</button>').join('') + '</div>';
    const regles = reglesOf(l.id).filter((r) => t === 'tout' || r.domaine === t);
    const mots = (t === 'tout' || t === 'vocabulaire') ? motsOf(l.id) : [];
    let body = '';
    if (l.corrections && l.corrections.length && t === 'tout') body += '<div class="note fix"><b>' + (l.correctionsLe ? 'Corrigé le ' + esc(frDate(l.correctionsLe)) : 'Corrections') + '</b><ul style="margin:6px 0 0;padding-left:18px">' + l.corrections.map((c) => '<li>' + esc(c) + '</li>').join('') + '</ul></div>';
    regles.forEach((r) => { body += '<div class="fiche-sec"><h3>' + esc(r.titre) + '</h3>' + regleCorps(r) + '</div>'; });
    if (mots.length) body += '<div class="fiche-sec"><h3>Vocabulaire</h3><div class="tablebox"><table><thead><tr><th scope="col">Na\'vi</th><th scope="col">Français</th><th scope="col">Catégorie</th></tr></thead><tbody>' + mots.map((m) => '<tr><td><span class="nv-cell"><span class="nv" lang="art-x-navi">' + esc(m.navi) + (m.variantes ? ', ' + esc(m.variantes.join(', ')) : '') + '</span>' + ecoute(m.navi, true) + '</span></td><td>' + esc(m.fr) + '</td><td class="muted">' + esc(m.categorie) + '</td></tr>').join('') + '</tbody></table></div></div>';
    if (!regles.length && !mots.length) body += '<p class="muted">Rien de ce type dans cette leçon.</p>';
    return top('Fiches') + tabs + types + '<article class="card"><div class="stack" style="gap:4px"><span class="eyebrow" style="color:var(--accent)">Leçon ' + l.num + ' · ' + statutLabel(l.statut) + '</span><h2>' + esc(l.titre) + '</h2></div>' + body +
      (S.fiche.report === l.id ? '<div class="card"><label for="report-text"><b>Qu\'est-ce qui te semble faux dans cette fiche ?</b></label><textarea id="report-text"></textarea>' + avisTicket() + '<div class="row"><button class="btn-ghost" data-a="fiche-report-send">Envoyer</button><button class="btn-link" data-a="fiche-report-cancel">Annuler</button></div></div>'
        : '<div class="spread"><span></span><button class="btn-link" data-a="fiche-report">Signaler une erreur dans cette fiche</button></div>') + '</article>' +
      '<button class="btn" data-a="practice-lesson" data-v="' + l.id + '">S\'entraîner sur cette leçon ' + ICON.arrow + '</button>';
  }

  // Carnet
  function vCarnet() {
    const all = Object.keys(S.erreurs).filter((m) => S.motifs[m]);
    const act = activeMotifs(); const mast = all.filter((m) => S.erreurs[m].statut !== 'active');
    const tab = S.carnetTab;
    const list = tab === 'active' ? act : mast;
    const cards = list.map((m) => {
      const e = S.erreurs[m]; const mo = S.motifs[m]; const n = S.notions[mo.notion] || {};
      const serie = Math.min(3, e.serie || 0);
      const can = exosForMotif(m).length > 0;
      return '<li class="card" style="gap:6px"><div class="spread"><h2 style="font-size:16px;font-family:var(--f-body)">' + esc(mo.titre) + '</h2><span class="tag">' + esc(n.libelle || '') + '</span></div>' +
        '<p class="small" style="color:var(--muted)">' + esc(mo.exemple) + '</p>' +
        '<div class="spread"><span class="row small muted" style="gap:8px"><span class="dots" aria-hidden="true">' + [0, 1, 2].map((i) => '<i class="' + (i < serie ? 'on' : '') + '"></i>').join('') + '</span>' +
        (tab === 'active' ? plural(serie, 'réussite', 'réussites') + ' sur 3' : 'Maîtrisée' + (e.maitrisee ? ' le ' + frDate(e.maitrisee) : '')) + '</span>' +
        (tab === 'active' && can ? '<button class="btn-link" style="color:var(--accent);text-decoration:none;font-weight:600" data-a="carnet-one" data-v="' + m + '">Retravailler</button>' : '') + '</div>' +
        '<span class="small muted">' + (e.origine === 'cours' && !e.derniere ? 'Repérée pendant le cours' : plural(e.occurrences || 0, 'fois', 'fois') + (e.derniere ? ', dernière le ' + frDate(e.derniere) : '')) + '</span></li>';
    }).join('');
    return top('Carnet d\'erreurs') +
      '<div class="seg" role="group" aria-label="Statut"><button data-a="ctab" data-v="active" aria-pressed="' + (tab === 'active') + '">Actives · ' + act.length + '</button><button data-a="ctab" data-v="mast" aria-pressed="' + (tab !== 'active') + '">Maîtrisées · ' + mast.length + '</button></div>' +
      '<p class="small muted">Une erreur est maîtrisée après 3 réussites d\'affilée sur les exercices qui la travaillent.</p>' +
      (list.length ? '<ul style="list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px">' + cards + '</ul>' : '<p class="muted">' + (tab === 'active' ? 'Aucune erreur active.' : 'Aucune erreur maîtrisée pour l\'instant.') + '</p>') +
      (tab === 'active' && act.length ? '<button class="btn" data-a="carnet-all">Retravailler les erreurs actives ' + ICON.arrow + '</button>' : '');
  }

  // Lexique
  function vLexique() {
    return top('Lexique') + '<div class="field"><label for="lex-q">Chercher en français ou en Na\'vi</label><input id="lex-q" class="search" type="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" value="' + esc(S.lexQ) + '" placeholder="par exemple : enfant, taron"></div>' + charbar() +
      '<section class="card" id="lex-list">' + lexList() + '</section>';
  }
  function lexList() {
    const q = fold(S.lexQ);
    const mots = Object.keys(S.elements).map((id) => S.elements[id]).filter((e) => e.type === 'mot' && isDone(e.lecon))
      .filter((e) => !q || fold(e.navi).includes(q) || fold(e.fr).includes(q) || (e.variantes || []).some((v) => fold(v).includes(q)))
      .sort((a, b) => fold(a.navi).localeCompare(fold(b.navi)));
    if (!mots.length) return '<p class="muted">Aucun mot trouvé.</p>';
    return mots.map((e) => '<div class="lex-item"><span>' + NV(e.navi) + (e.variantes ? ' <span class="small muted">(' + esc(e.variantes.join(', ')) + ')</span>' : '') + ecoute(e.navi, true) + '<br><span class="small muted">' + esc(e.categorie) + '</span></span><span style="text-align:right">' + esc(e.fr) + '<br><span class="small muted">L' + lessonNum(e.lecon) + '</span></span></div>').join('');
  }

  // Réglages
  function vReglages() {
    return top('Réglages') +
      '<section class="card"><label for="q-count"><b>Questions par séance du jour</b></label><select id="q-count" data-a="qcount">' + [12, 15, 18, 20].map((n) => '<option value="' + n + '"' + (S.params.questions === n ? ' selected' : '') + '>' + n + ' questions</option>').join('') + '</select>' +
      '<p class="small muted">Seuil de validation des bilans : ' + (S.params.seuil || 80) + ' %.</p></section>' +
      '<section class="card"><h2>Exporter vers Obsidian</h2><p class="small muted">Un fichier Markdown avec toutes les fiches, ta progression, ton carnet d\'erreurs et tes dernières séances.</p><button class="btn-ghost" data-a="export">Exporter (.md)</button></section>' +
      '<section class="card"><h2>Sources</h2><p class="small muted">Le contenu vient du dictionnaire de LearnNavi, de Wikipédia, de Wikibooks, de Kelutral, de « Na\'vi in a Nutshell » et du blog de Paul Frommer, créateur de la langue. Chaque règle indique sa source et sa date de vérification. ' +
        (ENV === 'autonome' ? 'Claude a aidé à préparer ce contenu, mais ne sert jamais de source.' : 'Claude ne sert jamais de source : il explique seulement, à partir de ces règles.') +
        ' Les liens « Écouter » ouvrent le dictionnaire <a href="https://reykunyu.lu/" target="_blank" rel="noopener">Reykunyu</a>, avec les enregistrements de Plumps et de tsyili quand ils existent.</p></section>' +
      vCouverture() +
      (ENV === 'autonome' ? '<section class="card"><h2>Ta progression</h2><p class="small muted">Elle est enregistrée dans ce navigateur, sur cet appareil seulement. Effacer les données du site l\'efface aussi.</p><button class="btn-link" data-tinan-reset>Effacer ma progression</button></section>' : '') +
      '<section class="card"><h2>Licences</h2><p class="small muted">Code sous licence <a href="' + DEPOT + '/blob/main/LICENSE" target="_blank" rel="noopener">MIT</a>, contenu pédagogique sous <a href="' + DEPOT + '/blob/main/LICENSE-CONTENT" target="_blank" rel="noopener">CC BY-SA 4.0</a>, polices Inter, Space Grotesk et Literata sous SIL Open Font License 1.1. Détail dans le <a href="' + DEPOT + '#licences" target="_blank" rel="noopener">README</a>.</p><p class="small muted">Tinan leNa\'vi ' + esc(VERSION) + (ENV === 'autonome' ? '' : ' · version publique : <a href="' + PAGE_PUBLIQUE + '" target="_blank" rel="noopener">' + PAGE_PUBLIQUE.replace('https://', '') + '</a>') + '</p></section>';
  }
  function vCouverture() {
    const c = COUVERTURE;
    const pv = (100 * c.mots / c.lexique).toFixed(1).replace('.', ',');
    return '<section class="card"><h2>Couverture du Na\'vi officiel</h2><div class="cover-figs">' +
      '<div><b>' + pv + ' %</b><span class="small muted">du vocabulaire : ' + c.mots + ' mots sur ' + c.lexique.toLocaleString('fr-FR') + ' dans le dictionnaire Reykunyu</span></div>' +
      '<div><b>' + c.grammaire + ' %</b><span class="small muted">de la grammaire du Horen (' + c.horen + ' % tous domaines confondus)</span></div></div>' +
      '<p class="small muted">Les nombres, les cas, les infixes et la négation sont bien couverts ; la formation des mots l\'est peu. Mesure du ' + esc(frDate(c.date)) + ' · <a href="' + DEPOT + '/blob/main/COUVERTURE.md" target="_blank" rel="noopener">voir le détail</a></p></section>';
  }

  // ------------------------------------------------------------------ navigation
  const VIEWS = ['accueil', 'libre', 'bilan', 'fiches', 'carnet', 'lexique', 'reglages'];
  function go(v) {
    if (v === 'accueil') { S.daily = null; if (location.hash) history.replaceState(null, '', location.pathname + location.search); S.view = 'accueil'; render(true); return; }
    S.view = v;
    if (location.hash !== '#' + v) location.hash = v; else render(true);
  }
  function route() {
    const h = (location.hash || '').slice(1);
    if (VIEWS.includes(h) && h !== 'accueil') S.view = h; else if (S.view !== 'seance' && S.view !== 'resultats') { S.view = 'accueil'; S.daily = null; }
    render(true);
  }
  window.addEventListener('hashchange', () => { if (S.status === 'ready') route(); });

  // ------------------------------------------------------------------ actions
  const A = {
    go: (el) => go(el.dataset.v),
    home: () => { S.run = null; go('accueil'); },
    reload: () => loadAll(),
    'start-daily': () => { const d = S.daily || buildDaily(); startRun('jour', d.items); },
    resume: () => {
      const u = unfinished(); if (!u) return;
      // Question déjà répondue avant la pause : on passe directement à la suivante.
      if (u.reponses.some((r) => r.i === u.index)) { u.index += 1; if (u.index < u.items.length) saveSeance(u); }
      if (u.index >= u.items.length) { S.run = { s: u, ui: freshUi(null) }; finish(); return; }
      openRun(u);
    },
    quit: () => { const s = S.run && S.run.s; if (s) saveSeance(s); S.run = null; toast('Séance mise en pause. Tu la reprendras depuis l\'accueil.'); go('accueil'); },
    skip: () => next(),
    pick: (el) => { const r = S.run; if (r.ui.phase !== 'question') return; r.ui.pick = Number(el.dataset.v); const x = S.exercices[currentItem().id]; answer(evaluate(currentItem(), r.ui), x.options[r.ui.pick].t); render(); },
    validate: () => {
      const r = S.run; const item = currentItem(); if (r.ui.phase !== 'question') return;
      if (item.k !== 'exo' || S.exercices[item.id].type !== 'formes') { const inp = document.getElementById('answer'); if (inp) r.ui.text = inp.value; if (!r.ui.text.trim()) return; }
      else if (r.ui.filled.some((v) => v == null)) return;
      const given = item.k === 'exo' && S.exercices[item.id].type === 'formes' ? r.ui.filled.map((i) => S.exercices[item.id].etiquettes[i]).join(' ') : r.ui.text;
      answer(evaluate(item, r.ui), given); render();
    },
    slot: (el) => { const ui = S.run.ui; const i = ui.filled.indexOf(null); if (i >= 0) { ui.filled[i] = Number(el.dataset.v); render(); } },
    unslot: (el) => { const ui = S.run.ui; ui.filled[Number(el.dataset.v)] = null; render(); },
    flip: () => { S.run.ui.flipped = true; render(); },
    card: (el) => { answer({ ok: el.dataset.v === '1', verdict: el.dataset.v === '1' ? 'ok' : 'ko' }, el.dataset.v === '1' ? 'savais' : 'ne savais pas'); next(); },
    next: () => next(),
    why: () => askWhy(),
    report: () => { S.run.ui.report = 'open'; render(); const t = document.getElementById('report-text'); if (t) t.focus(); },
    'report-cancel': () => { S.run.ui.report = null; render(); },
    'report-send': async () => {
      const item = currentItem();
      const target = item.k === 'exo' ? { id: item.id, type: 'exercice', lecon: (S.exercices[item.id] || {}).lecon, contexte: (S.exercices[item.id] || {}).consigne } : { id: item.id, type: 'element', lecon: (S.elements[item.id] || {}).lecon, contexte: (S.elements[item.id] || {}).navi };
      if (ENV === 'autonome') {
        // Pour le ticket GitHub : la question, la réponse donnée et la réponse attendue.
        const ui = S.run.ui; const x = item.k === 'exo' ? S.exercices[item.id] : null;
        if (x && x.enonce) target.contexte += ' — ' + x.enonce;
        target.donnee = givenAnswer(x, ui); target.attendu = ui.verdict && ui.verdict.attendu;
      }
      if (await sendReport(target)) { S.run.ui.report = 'sent'; render(); }
    },
    ltype: (el) => { S.libre.types[el.dataset.v] = !S.libre.types[el.dataset.v]; render(); },
    llec: (el) => { const a = S.libre.lecons; const i = a.indexOf(el.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(el.dataset.v); render(); },
    lnot: (el) => { const a = S.libre.notions; const i = a.indexOf(el.dataset.v); if (i >= 0) a.splice(i, 1); else a.push(el.dataset.v); render(); },
    lcount: (el) => { S.libre.count = Number(el.dataset.v); render(); },
    lprio: (el) => { S.libre.prio = el.checked; },
    'start-libre': () => startRun('libre', buildLibre(S.libre), { lecons: S.libre.lecons.slice() }),
    'start-bilan': (el) => startRun('bilan', buildBilan(el.dataset.v), { lecon: el.dataset.v }),
    fiche: (el) => { S.fiche.lecon = el.dataset.v; S.fiche.type = 'tout'; go('fiches'); },
    'fiche-lec': (el) => { S.fiche.lecon = el.dataset.v; S.fiche.report = null; render(); },
    'fiche-type': (el) => { S.fiche.type = el.dataset.v; render(); },
    'fiche-report': () => { S.fiche.report = S.fiche.lecon; render(); const t = document.getElementById('report-text'); if (t) t.focus(); },
    'fiche-report-cancel': () => { S.fiche.report = null; render(); },
    'fiche-report-send': async () => { if (await sendReport({ id: S.fiche.lecon, type: 'fiche', lecon: S.fiche.lecon, contexte: 'Fiche de la leçon' })) { S.fiche.report = null; render(); } },
    'practice-lesson': (el) => { const lid = el.dataset.v; startRun('libre', buildLibre({ types: { voc: true, gram: true, pho: true }, lecons: [lid], notions: Object.keys(S.notions), count: 15, prio: false }), { lecons: [lid] }); },
    ctab: (el) => { S.carnetTab = el.dataset.v === 'active' ? 'active' : 'mast'; render(); },
    'carnet-one': (el) => startRun('carnet', buildCarnet(el.dataset.v), { motif: el.dataset.v }),
    'carnet-all': () => startRun('carnet', buildCarnet('all'), { motif: 'all' }),
    export: () => exportMd()
  };

  document.addEventListener('click', (e) => {
    const ch = e.target.closest('.charbtn');
    if (ch) {
      const inp = document.getElementById('answer') || document.getElementById('lex-q');
      if (!inp || inp.readOnly) return;
      const c = ch.dataset.ch; const a = inp.selectionStart ?? inp.value.length; const b = inp.selectionEnd ?? inp.value.length;
      inp.value = inp.value.slice(0, a) + c + inp.value.slice(b);
      inp.focus(); try { inp.setSelectionRange(a + c.length, a + c.length); } catch (_) {}
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    const el = e.target.closest('[data-a]');
    if (!el || el.tagName === 'SELECT' || (el.tagName === 'INPUT' && el.type !== 'checkbox')) return;
    const fn = A[el.dataset.a];
    if (fn) { if (el.tagName !== 'INPUT') e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('pointerdown', (e) => { if (e.target.closest('.charbtn')) e.preventDefault(); });
  document.addEventListener('input', (e) => {
    if (e.target.id === 'answer' && S.run) {
      S.run.ui.text = e.target.value;
      const b = document.getElementById('validate'); if (b) b.disabled = !e.target.value.trim();
    } else if (e.target.id === 'lex-q') {
      S.lexQ = e.target.value; const l = document.getElementById('lex-list'); if (l) l.innerHTML = lexList();
    }
  });
  document.addEventListener('change', (e) => {
    if (e.target.dataset && e.target.dataset.a === 'qcount') {
      const n = Number(e.target.value); S.params = Object.assign({}, S.params, { questions: n }); S.daily = null;
      write('parametres/general', S.params); toast('Séance du jour : ' + n + ' questions.');
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && e.target.id === 'answer' && S.run && S.run.ui.phase === 'question') { e.preventDefault(); A.validate(); }
  });

  // ------------------------------------------------------------------ démarrage
  // Version autonome : « Effacer ma progression » (Réglages).
  document.addEventListener('click', (e) => {
    if (ENV !== 'autonome' || !locale || !e.target.closest || !e.target.closest('[data-tinan-reset]')) return;
    e.preventDefault();
    if (!window.confirm('Effacer toute ta progression sur cet appareil ? Les leçons, les fiches et les exercices restent.')) return;
    locale.effacer();
    history.replaceState(null, '', location.pathname + location.search); // repartir de l'accueil
    location.reload();
  });

  (async function boot() {
    if (ENV === 'autonome') {
      locale = baseLocale(window.__CONTENU);
      S.db = locale.db; S.downloads = locale.downloads;
      loadAll();
      return;
    }
    if (ENV !== 'claude') { S.status = 'nodb'; render(); return; }
    window.claude.use('sample').then((s) => { S.sample = s; }).catch(() => {});
    window.claude.use('downloads').then((d) => { S.downloads = d; }).catch(() => {});
    const db = await window.claude.use('db').catch(() => null);
    if (!db) { S.status = 'nodb'; render(); return; }
    S.db = db;
    loadAll();
  })();
})();
</script>

</body>
</html>
