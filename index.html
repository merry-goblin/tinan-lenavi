<style>
/* Layout : une colonne façon téléphone (520px max), cartes et listes empilées, actions en bas de chaque écran. */
:root {
  --bg: #F4F6F5; --surface: #FFFFFF; --surface-2: #EEF2F1; --ink: #15211F; --muted: #4B5A57;

    --accent: #5FC4CF; --accent-soft: #163338; --accent-ink: #A8E3EA; --on-accent: #06262A;
    --warn: #F2955D; --warn-soft: #3A2216; --warn-ink: #F7C09E;
    --hero: #1B302E; --hero-ink: #EEF5F3; --hero-sub: #9CC9CE; --hero-btn: #7FD3DD; --hero-btn-ink: #0B2A2E; --hero-chip: rgba(255,255,255,0.08);
    --pill-off: #22302E; --pill-off-ink: #9FB1AD;
    --btn: #E4ECEA; --btn-ink: #0E1514;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1514; --surface: #162120; --surface-2: #1C2927; --ink: #E4ECEA; --muted: #9FB1AD;
  --line: #2A3835; --line-strong: #4A5D59;
  --accent: #5FC4CF; --accent-soft: #163338; --accent-ink: #A8E3EA; --on-accent: #06262A;
  --warn: #F2955D; --warn-soft: #3A2216; --warn-ink: #F7C09E;
  --hero: #1B302E; --hero-ink: #EEF5F3; --hero-sub: #9CC9CE; --hero-btn: #7FD3DD; --hero-btn-ink: #0B2A2E; --hero-chip: rgba(255,255,255,0.08);
  --pill-off: #22302E; --pill-off-ink: #9FB1AD;
  --btn: #E4ECEA; --btn-ink: #0E1514;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.45; -webkit-text-size-adjust: 100%; }
.wrap { max-width: 520px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 48px; display: flex; flex-direction: column; gap: 20px; min-height: 100%; }
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 600; text-wrap: balance; }
h1 { font-size: 26px; line-height: 1.15; }
h2 { font-size: 18px; }
h3 { font-size: 15px; font-family: var(--f-body); }
p { margin: 0; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.nv { font-family: var(--f-navi); font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spread { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.eyebrow { font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }

/* En-têtes */
.top { display: flex; align-items: center; gap: 12px; }
.iconbtn { width: 44px; height: 44px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: inline-flex; align-items: center; justify-content: center; color: var(--ink); }
.iconbtn svg { width: 20px; height: 20px; }
.brand { font-family: var(--f-navi); font-weight: 600; color: var(--accent); font-size: 15px; letter-spacing: 0.01em; }

/* Boutons */
.btn { min-height: 52px; border-radius: var(--r-md); border: none; background: var(--btn); color: var(--btn-ink); font-weight: 600; font-size: 16px; padding: 0 18px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.btn[disabled] { opacity: 0.4; cursor: default; }
.btn-ghost { min-height: 44px; border-radius: 999px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); font-weight: 600; padding: 0 16px; }
.btn-link { min-height: 44px; border: none; background: transparent; color: var(--muted); text-decoration: underline; padding: 0 6px; font-size: 14px; }
.btn svg { width: 20px; height: 20px; }

/* Héros séance du jour */
.hero { background: var(--hero); color: var(--hero-ink); border-radius: var(--r-lg); padding: 22px; display: flex; flex-direction: column; gap: 16px; }
.hero .eyebrow { color: var(--hero-sub); }
.hero-num { font-family: var(--f-display); font-size: 34px; font-weight: 600; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hero-sub { color: var(--hero-sub); font-size: 15px; }
.hero-chip { font-size: 13px; padding: 6px 10px; border-radius: 999px; background: var(--hero-chip); }
.hero-btn { min-height: 52px; border-radius: var(--r-md); border: none; background: var(--hero-btn); color: var(--hero-btn-ink); font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.hero-btn svg { width: 20px; height: 20px; }
.hero-alt { min-height: 44px; border-radius: var(--r-md); border: 1px solid var(--hero-sub); background: transparent; color: var(--hero-ink); font-weight: 500; }

/* Progression des leçons */
.lessons { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.pill { height: 38px; border-radius: var(--r-sm); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; border: 1.5px solid transparent; font-variant-numeric: tabular-nums; }
button.pill { padding: 0; }
.pill.validee { background: var(--accent); color: var(--on-accent); }
.pill.faite { background: var(--surface); border-color: var(--accent); color: var(--accent); }
.pill.a-venir { background: var(--pill-off); color: var(--pill-off-ink); font-weight: 500; }
.legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }

/* Tuiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; text-align: left; min-height: 108px; color: var(--ink); }
.tile-ic { width: 36px; height: 36px; border-radius: var(--r-sm); background: var(--accent-soft); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.tile-ic.warn { background: var(--warn-soft); color: var(--warn); }
.tile-ic svg { width: 20px; height: 20px; }
.tile b { font-size: 15px; display: block; }
.tile small { font-size: 13px; color: var(--muted); }
.links { display: flex; gap: 4px; flex-wrap: wrap; justify-content: center; }

/* Cartes génériques */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.tag { align-self: flex-start; font-size: 12px; font-weight: 600; color: var(--accent-ink); background: var(--accent-soft); padding: 5px 10px; border-radius: 999px; }
.tag.warn { color: var(--warn-ink); background: var(--warn-soft); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 600; }
.chip.soft[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-ink); border-color: var(--accent); }
.chip svg { width: 16px; height: 16px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; background: var(--pill-off); border-radius: var(--r-md); padding: 4px; }
.seg button { min-height: 40px; border-radius: var(--r-sm); border: none; background: transparent; color: var(--muted); font-weight: 500; font-size: 13px; padding: 0 2px; min-width: 0; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 600; }

/* Exercices */
.progress { flex-grow: 1; height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--accent); border-radius: 999px; }
.count { font-size: 14px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.prompt { font-family: var(--f-display); font-size: 22px; font-weight: 600; line-height: 1.25; }
.stage { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 24px 18px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.stage .big { font-family: var(--f-navi); font-weight: 600; font-size: 34px; line-height: 1.2; overflow-wrap: anywhere; }
.stage .big.fr { font-family: var(--f-body); font-weight: 600; font-size: 24px; }
.stage .gloss { color: var(--muted); font-size: 15px; }
.options { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.options.long { grid-template-columns: minmax(0, 1fr); }
.opt { min-height: 52px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface); padding: 10px 12px; font-size: 16px; display: flex; align-items: center; justify-content: center; gap: 8px; text-align: center; color: var(--ink); overflow-wrap: anywhere; }
.opt.nvopt { font-family: var(--f-navi); font-weight: 600; font-size: 18px; }
.opt.good { border: 2px solid var(--accent); background: var(--accent-soft); color: var(--accent-ink); }
.opt.bad { border: 2px solid var(--warn); background: var(--warn-soft); color: var(--warn-ink); }
.opt.dim { color: var(--muted); }
.opt svg { width: 18px; height: 18px; flex-shrink: 0; }
.field { display: flex; flex-direction: column; gap: 8px; }
.field label { font-size: 14px; font-weight: 600; }
.answer { height: 56px; border-radius: var(--r-md); border: 1.5px solid var(--line-strong); background: var(--surface); padding: 0 16px; font-family: var(--f-navi); font-size: 21px; width: 100%; }
.charbar { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.charbar button { height: 48px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-family: var(--f-navi); font-size: 22px; }
.sentence { font-family: var(--f-navi); font-size: 22px; font-weight: 600; line-height: 1.9; text-align: center; }
.slot { display: inline-flex; min-width: 76px; min-height: 40px; padding: 0 10px; margin: 0 2px; align-items: center; justify-content: center; border: none; border-bottom: 2.5px solid var(--line-strong); background: transparent; font-family: var(--f-navi); font-size: 20px; font-weight: 600; color: var(--accent); vertical-align: middle; border-radius: 6px 6px 0 0; }
.slot.filled { background: var(--accent-soft); }
.tagbank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tagbank button { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); font-family: var(--f-navi); font-weight: 600; font-size: 18px; }
.tagbank button[disabled] { opacity: 0.3; }
.fb { border-radius: 16px; padding: 16px; display: flex; gap: 12px; align-items: flex-start; }
.fb svg { width: 22px; height: 22px; flex-shrink: 0; margin-top: 1px; }
.fb .stack { gap: 6px; min-width: 0; }
.fb.ok { background: var(--accent-soft); color: var(--accent-ink); }
.fb.ko { background: var(--warn-soft); color: var(--warn-ink); }
.why { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.why-label { display: flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
.why-label svg { width: 14px; height: 14px; }
.why-text { white-space: pre-line; font-size: 15px; line-height: 1.5; }
textarea { width: 100%; min-height: 84px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); padding: 10px 12px; resize: vertical; }
.flipcard { min-height: 210px; justify-content: center; }

/* Fiches */
.fiche-sec { display: flex; flex-direction: column; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); }
.fiche-sec:first-of-type { border-top: none; padding-top: 0; }
.tablebox { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 8px 8px 0; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: none; font-size: 13px; color: var(--muted); font-weight: 600; }
.ex { display: flex; flex-direction: column; gap: 2px; padding: 6px 0; border-top: 1px solid var(--line); }
.ex:first-child { border-top: none; }
.note { background: var(--surface-2); border-radius: 12px; padding: 12px; font-size: 14px; }
.note.fix { background: var(--warn-soft); color: var(--warn-ink); }
.src { font-size: 12px; color: var(--muted); }

/* Carnet */
.dots { display: inline-flex; gap: 5px; align-items: center; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); display: inline-block; }
.dots i.on { background: var(--accent); }

/* Résultats */
.score { font-family: var(--f-display); font-size: 48px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; }
.bar { height: 10px; border-radius: 999px; background: var(--line); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); }

/* États */
.empty { text-align: center; padding: 40px 12px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
.empty .nv { font-size: 28px; color: var(--accent); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--btn); color: var(--btn-ink); padding: 10px 16px; border-radius: 12px; font-size: 14px; max-width: calc(100% - 32px); z-index: 20; box-shadow: 0 6px 20px rgba(0,0,0,0.18); }
.lex-item { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); align-items: baseline; }
.lex-item:first-child { border-top: none; }
.search { height: 48px; border-radius: var(--r-md); border: 1.5px solid var(--line-strong); background: var(--surface); padding: 0 14px; width: 100%; }
select { height: 44px; border-radius: 12px; border: 1.5px solid var(--line-strong); background: var(--surface); padding: 0 10px; }
@media (prefers-reduced-motion: no-preference) {
  .progress i, .bar i { transition: width 0.3s ease; }
}
/* Lien « Écouter » vers Reykunyu (D-023) */
.listen { display: inline-flex; align-items: center; gap: 4px; min-height: 32px; font-family: var(--f-body); font-size: 13px; font-weight: 500; color: var(--accent); text-decoration: none; white-space: nowrap; vertical-align: middle; }
.listen svg { width: 16px; height: 16px; flex-shrink: 0; }
.listen.icon-only { min-width: 32px; justify-content: center; }
.listen:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.nv-cell { display: inline-flex; align-items: center; gap: 2px; flex-wrap: wrap; }
.cover-figs { display: flex; gap: 10px; }
.cover-figs > div { flex: 1; background: var(--surface-2); border-radius: var(--r-sm); padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.cover-figs b { font-family: var(--f-display); font-size: 22px; }
.card a { color: var(--accent); }
</style>

],"navi":"kehe","fr":"non","categorie":"particule","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-tute":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"tute","fr":"personne","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-nantang":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"nantang","fr":"loup-vipère","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-frip":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"frìp","fr":"mordre","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-eveng":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"'eveng","fr":"enfant","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-tskxe":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"tskxe","fr":"roche, pierre","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-kllpxiltu":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"kllpxìltu","fr":"territoire","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-taftxuyu":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"täftxuyu","fr":"tisserand(e)","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-vrrtep":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"vrrtep","fr":"démon","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-hrrap":{"type":"mot","lecon":"L1","notions":["vocabulaire"],"navi":"hrrap","fr":"danger","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"r-L1-sons":{"type":"regle","lecon":"L1","notions":["phonologie"],"domaine":"phonologie","ordre":1,"titre":"Les sons propres au Na'vi","texte":["Le Na'vi a trois consonnes éjectives, prononcées avec une petite explosion d'air : px, tx et kx.","L'apostrophe note un coup de glotte, l'arrêt de la voix qu'on entend au milieu de « uh-oh ».","ll et rr peuvent former une syllabe à eux seuls, comme une voyelle. Le r est battu (un seul battement, comme dans l'espagnol pero) ; rr est roulé."],"source":"Wikibooks, Na'vi, Dictionnaire LearnNavi (Eana Eltu), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","tableau":{"colonnes":["Son","Exemple","Sens"],"lignes":[["px","kllpxìltu","territoire"],["tx","täftxuyu","tisserand(e)"],["kx","tskxe","roche"],["'","'eveng","enfant"],["ll","plltxe","parler"],["rr","vrrtep","démon"]],"navi":[0,1]}},"r-L1-ordre":{"type":"regle","lecon":"L1","notions":["cas"],"domaine":"grammaire","ordre":2,"titre":"Un ordre des mots libre","texte":["En Na'vi, le rôle d'un nom ne dépend pas de sa place dans la phrase, mais de sa terminaison : son cas.","Les trois phrases ci-dessous disent la même chose. Le sujet nantang porte -ìl, l'objet tute porte -t.","L'ordre est libre au niveau des groupes de mots : on ne coupe pas un groupe. Changer l'ordre ne change pas le sens, seulement l'insistance."],"source":"Na'vi in a Nutshell (LearnNavi), Kelutral.org, Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"Nantangìl frìp tutet.","fr":"Un loup-vipère mord la personne."},{"navi":"Tutet nantangìl frìp.","fr":"Un loup-vipère mord la personne."},{"navi":"Frìp tutet nantangìl.","fr":"Un loup-vipère mord la personne."}]},"r-L1-cas":{"type":"regle","lecon":"L1","notions":["cas"],"domaine":"grammaire","ordre":3,"titre":"Les cas","texte":["La terminaison dépend de la dernière lettre du nom : voyelle ou consonne.","Au génitif, on met -ä après une consonne, mais aussi après o et u.","Le sujet d'un verbe sans objet ne prend aucune terminaison : c'est le subjectif (leçon 4)."],"source":"Kelutral.org, Wikipédia, Na'vi grammar, Reykunyu (conjugateur), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","tableau":{"colonnes":["Cas","Rôle","Après voyelle","Après consonne"],"lignes":[["Subjectif","sujet d'un verbe sans objet","aucune : tute","aucune : nantang"],["Agentif","sujet d'un verbe avec objet","-l : tutel","-ìl : nantangìl"],["Patientif","objet","-t, -ti : tutet, tuteti","-it : nantangit"],["Datif","à, pour","-r, -ru : tuter, tuteru","-ur : nantangur"],["Génitif","de (possession)","-yä : tuteyä","-ä : nantangä"],["Topique","quant à","-ri : tuteri","-ìri : nantangìri"]],"navi":[2,3]}},"r-L1-nombre":{"type":"regle","lecon":"L1","notions":["nombre"],"domaine":"grammaire","ordre":4,"titre":"Le nombre","texte":["Le Na'vi distingue le singulier, le duel (2), le triel (3) et le pluriel. Ils se marquent par des préfixes.","Ces préfixes adoucissent la consonne qui suit : c'est la lénition. px → p, tx → t, kx → k, p → f, t → s, k → h, ts → s, et le ' disparaît.","Au pluriel, quand la lénition change le mot, on peut omettre ay- : c'est le pluriel court (sute)."],"source":"Wikipédia, Na'vi grammar, Reykunyu (conjugateur)","verifie":"2026-11-12","tableau":{"colonnes":["Nombre","Préfixe","tute","tskxe","'eveng"],"lignes":[["Singulier","—","tute","tskxe","'eveng"],["Duel","me-","mesute","meskxe","meveng"],["Triel","pxe-","pxesute","pxeskxe","pxeveng"],["Pluriel","ay-","aysute, sute","ayskxe, skxe","ayeveng, eveng"]],"navi":[1,2,3,4]},"correction":"La leçon donnait metute, pxetute, aytute, sans lénition."},"r-L1-expressions":{"type":"regle","lecon":"L1","notions":["expressions"],"domaine":"vocabulaire","ordre":5,"titre":"Premières expressions","texte":["Quelques formules à connaître par cœur."],"source":"Dictionnaire LearnNavi (Eana Eltu), Kelutral.org","verifie":"2026-11-19","exemples":[{"navi":"Kaltxì !","fr":"Bonjour !"},{"navi":"Irayo.","fr":"Merci."},{"navi":"Srane.","fr":"Oui."},{"navi":"Kehe.","fr":"Non."},{"navi":"Oel ngati kameie.","fr":"Je te vois. (salutation familière)"},{"navi":"Eywa ngahu.","fr":"Au revoir. (Qu'Eywa soit avec toi.)"}]},"m-taron":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"taron","fr":"chasser","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-kame":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"kame","fr":"voir (au sens profond)","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-tingnari":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"tìng nari","fr":"regarder","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-plltxe":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"plltxe","fr":"parler","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-hum":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"hum","fr":"partir","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-omum":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"omum","fr":"savoir, connaître (un fait)","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tiran":{"type":"mot","lecon":"L2","notions":["vocabulaire"],"navi":"tìran","fr":"marcher","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"r-L2-place":{"type":"regle","lecon":"L2","notions":["infixes"],"domaine":"grammaire","ordre":1,"titre":"Où va l'infixe ?","texte":["Un infixe s'insère à l'intérieur du verbe, juste avant la voyelle d'une syllabe, après toutes les consonnes qui la précèdent : tsw‹am›ayon. Si la syllabe commence par une voyelle, l'infixe se met en tête : ‹iv›omum → ivomum. Devant ll ou rr : p‹ìm›lltxe → pìmlltxe.","Les infixes de temps et d'aspect vont dans l'avant-dernière syllabe. Dans un verbe d'une syllabe, ils vont avant la voyelle.","La dernière syllabe accueille les infixes d'humeur, comme ‹ei› (le locuteur est content) : kameie."],"source":"Kelutral.org, Wikipédia, Na'vi grammar, Reykunyu (conjugateur), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"t‹am›aron → tamaron","fr":"chassait"},{"navi":"t‹am›ìran → tamìran","fr":"marchait"},{"navi":"h‹am›um → hamum","fr":"partait"},{"navi":"kam‹ei›e → kameie","fr":"voit (avec joie)"}],"correction":"La leçon plaçait l'infixe dans la dernière syllabe (tarìmon, tamon)."},"r-L2-temps":{"type":"regle","lecon":"L2","notions":["infixes"],"domaine":"grammaire","ordre":2,"titre":"Les infixes de temps","texte":["Sans infixe, le verbe est au présent ou au temps général."],"source":"Kelutral.org, Wikipédia, Na'vi grammar, Reykunyu (conjugateur)","verifie":"2026-11-12","tableau":{"colonnes":["Infixe","Temps","taron","tìran"],"lignes":[["‹am›","passé","tamaron","tamìran"],["‹ìm›","passé récent","tìmaron","tìmìran"],["—","présent","taron","tìran"],["‹ìy›","futur proche","tìyaron","tìyìran"],["‹ay›","futur","tayaron","tayìran"]],"navi":[0,2,3]}},"r-L2-aspect":{"type":"regle","lecon":"L2","notions":["infixes"],"domaine":"grammaire","ordre":3,"titre":"Les infixes d'aspect","texte":["L'aspect dit si l'action est en cours ou accomplie. Ses infixes vont à la même place que ceux du temps."],"source":"Kelutral.org, Wikipédia, Na'vi grammar, Reykunyu (conjugateur)","verifie":"2026-11-12","tableau":{"colonnes":["Infixe","Aspect","taron"],"lignes":[["‹er›","en cours","teraron : est en train de chasser"],["‹ol›","accompli","tolaron : a chassé (c'est fait)"]],"navi":[0]},"correction":"La leçon les plaçait dans la dernière syllabe et y rangeait ‹iv›, qui est le subjonctif."},"r-L2-combines":{"type":"regle","lecon":"L2","notions":["infixes"],"domaine":"grammaire","ordre":4,"titre":"Temps et aspect ensemble","texte":["On ne met pas deux infixes à la suite : on utilise un seul infixe composé."],"source":"Wikipédia, Na'vi grammar, Kelutral.org","verifie":"2026-11-12","tableau":{"colonnes":["Infixe","Sens","taron"],"lignes":[["‹arm›","passé en cours","tarmaron"],["‹alm›","passé accompli","talmaron"],["‹ìrm›","passé récent en cours","tìrmaron"],["‹ìlm›","passé récent accompli","tìlmaron"],["‹ìry›","futur proche en cours","tìryaron"],["‹ìly›","futur proche accompli","tìlyaron"],["‹ary›","futur en cours","taryaron"],["‹aly›","futur accompli","talyaron"]],"navi":[0,2]},"correction":"La leçon donnait tamolron et tamarolon."},"m-oe":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"oe","fr":"je, moi","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-nga":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"nga","fr":"tu, toi","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-po":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"po","fr":"il, elle","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-oeng":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"oeng","fr":"nous deux (toi et moi)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-moe":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"moe","fr":"nous deux (lui ou elle et moi)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-ayoe":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"ayoe","fr":"nous (sans toi)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-aynga":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"aynga","fr":"vous","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-ayfo":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"ayfo","fr":"ils, elles","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12","variantes":["fo"]},"m-tsko":{"type":"mot","lecon":"L3","notions":["vocabulaire"],"navi":"tsko","fr":"arc","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"r-L3-base":{"type":"regle","lecon":"L3","notions":["pronoms"],"domaine":"grammaire","ordre":1,"titre":"Les pronoms personnels","texte":["Les pronoms ont un duel, un triel et un pluriel, comme les noms. Le Na'vi distingue un « nous » qui t'inclut et un « nous » qui t'exclut.","Le pluriel de po est ayfo ou fo : la lénition change p en f.","awnga, forme courte de ayoeng, est la plus courante."],"source":"Wikipédia, Na'vi grammar, Dictionnaire LearnNavi (Eana Eltu), Reykunyu (conjugateur)","verifie":"2026-11-19","tableau":{"colonnes":["Personne","Singulier","Duel","Triel","Pluriel"],"lignes":[["1re, sans toi","oe","moe","pxoe","ayoe"],["1re, avec toi","—","oeng","pxoeng","ayoeng, awnga"],["2e","nga","menga","pxenga","aynga"],["3e","po","mefo","pxefo","ayfo, fo"]],"navi":[1,2,3,4]},"correction":"La leçon donnait aypo pour « ils, elles »."},"r-L3-inclusif":{"type":"regle","lecon":"L3","notions":["pronoms"],"domaine":"grammaire","ordre":2,"titre":"Deux « nous »","texte":["oeng veut dire « toi et moi » : la personne à qui l'on parle est incluse.","moe veut dire « lui ou elle et moi » : la personne à qui l'on parle est exclue.","Au pluriel : ayoeng (avec toi) et ayoe (sans toi)."],"source":"Wikipédia, Na'vi grammar, Wikibooks, Na'vi","verifie":"2026-11-12"},"r-L3-cas":{"type":"regle","lecon":"L3","notions":["pronoms"],"domaine":"grammaire","ordre":3,"titre":"Les pronoms et les cas","texte":["Les pronoms prennent les mêmes terminaisons que les noms, avec quelques formes irrégulières : ngeyä, peyä et oengal.","Attention au « me » français : il peut être un objet direct ou vouloir dire « à moi ». Pour savoir lequel, remplace-le par « le » ou « lui ».","« Tu me chasses » → « tu le chasses » : objet direct, donc patientif (oeti). Le verbe a un objet, donc le sujet prend -l : Ngal oeti taron.","« Il me parle » → « il lui parle » : « à moi », donc datif (oeru). Il n'y a pas d'objet au patientif, donc le sujet reste sans marque : Po oeru plltxe.","Règle : le sujet prend -l seulement si la phrase a un objet au patientif. Un datif ne compte pas. La leçon 4 détaille ce point."],"source":"Wikibooks, Na'vi, Kelutral.org, Na'vi in a Nutshell (LearnNavi), Na'viteri (Paul Frommer), Reykunyu (conjugateur)","verifie":"2026-11-19","tableau":{"colonnes":["","Agentif","Patientif","Datif","Génitif"],"lignes":[["oe","oel","oeti","oer, oeru","oeyä"],["nga","ngal","ngat, ngati","ngar, ngaru","ngeyä"],["po","pol","pot, poti","por, poru","peyä"],["oeng","oengal","oengat, oengati","oengar, oengaru","oengeyä"]],"navi":[0,1,2,3,4]},"exemples":[{"navi":"Oel ngati kameie.","fr":"Je te vois."},{"navi":"Ngal oeti taron.","fr":"Tu me chasses."},{"navi":"Po oeru plltxe.","fr":"Il/elle me parle."},{"navi":"oeyä tsko","fr":"mon arc"},{"navi":"ngeyä tsko","fr":"ton arc"}],"correction":"La leçon donnait oengìl comme agentif de oeng."},"m-tsea":{"type":"mot","lecon":"L4","notions":["vocabulaire"],"navi":"tse'a","fr":"voir (au sens physique)","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-ting":{"type":"mot","lecon":"L4","notions":["vocabulaire"],"navi":"tìng","fr":"donner","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-yom":{"type":"mot","lecon":"L4","notions":["vocabulaire"],"navi":"yom","fr":"manger","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-rey":{"type":"mot","lecon":"L4","notions":["vocabulaire"],"navi":"rey","fr":"vivre","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-syuve":{"type":"mot","lecon":"L4","notions":["vocabulaire"],"navi":"syuve","fr":"nourriture","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"r-L4-alignement":{"type":"regle","lecon":"L4","notions":["alignement"],"domaine":"grammaire","ordre":1,"titre":"Trois rôles, trois formes","texte":["Le sujet d'un verbe qui a un objet prend l'agentif : -l ou -ìl.","L'objet prend le patientif : -t, -ti ou -it.","Le sujet d'un verbe sans objet ne prend aucune marque. C'est aussi le cas d'un verbe transitif employé sans objet, quand l'objet n'a pas d'importance : Po taron, « il chasse ».","Mais si l'objet est seulement sous-entendu par le contexte, le sujet garde -l : « Ngal ke tse'a txepit srak? » « Oel tse'a. », je (le) vois. (Précision de la leçon 14.)","La personne à qui l'on parle ou à qui l'on donne se met au datif."],"source":"Na'vi in a Nutshell (LearnNavi), Wikipédia, Na'vi grammar, Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer)","verifie":"2026-11-19","exemples":[{"navi":"Oel poti tse'a.","fr":"Je le/la vois."},{"navi":"Oe tìran.","fr":"Je marche."},{"navi":"Oel omum tsat.","fr":"Je sais cela."},{"navi":"Oe rey.","fr":"Je vis."},{"navi":"Po taron.","fr":"Il/elle chasse."},{"navi":"Pol taron yerikit.","fr":"Il/elle chasse un hexapède."},{"navi":"Oel tse'a.","fr":"Je (le) vois. (L'objet est sous-entendu.)"}]},"r-L4-verbes":{"type":"regle","lecon":"L4","notions":["alignement"],"domaine":"grammaire","ordre":2,"titre":"Verbes transitifs et intransitifs","texte":["Un verbe transitif peut avoir un objet. Un verbe intransitif n'en a jamais.","omum sert à connaître un fait. Pour connaître une personne, on emploie smon, intransitif : la personne connue est le sujet, celle qui connaît se met au datif. Po smon oer, « je le connais » (mot à mot : il m'est familier)."],"source":"Dictionnaire LearnNavi (Eana Eltu), Na'vi in a Nutshell (LearnNavi), Na'viteri (Paul Frommer), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","tableau":{"colonnes":["Transitifs","Sens","Intransitifs","Sens"],"lignes":[["taron","chasser","tìran","marcher"],["kame","voir (profond)","hum","partir"],["tse'a","voir","rey","vivre"],["omum","savoir (un fait)","tìng nari","regarder"],["tìng","donner","smon","connaître (quelqu'un)"],["yom","manger","",""],["plltxe","parler","",""]],"navi":[0,2]},"exemples":[{"navi":"Oel syuvet yom.","fr":"Je mange la nourriture."},{"navi":"Oe yom.","fr":"Je mange."},{"navi":"Po smon oer.","fr":"Je le/la connais."}],"correction":"La leçon classait yom et plltxe parmi les intransitifs. Avec plltxe, la personne à qui l'on parle reste au datif : Po oeru plltxe."},"m-tsawl":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"tsawl","fr":"grand","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-hii":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"hì'i","fr":"petit","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-lor":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"lor","fr":"beau, belle","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-txur":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"txur","fr":"fort","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-ngim":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"ngim","fr":"long","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-siltsan":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"sìltsan","fr":"bon","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-kilvan":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"kilvan","fr":"rivière","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-fpom":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"fpom","fr":"paix, bien-être","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"m-lefpom":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"lefpom","fr":"heureux, paisible","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-12"},"r-L5-a":{"type":"regle","lecon":"L5","notions":["adjectifs"],"domaine":"grammaire","ordre":1,"titre":"Le a de l'adjectif","texte":["Un adjectif qui qualifie directement un nom y est relié par a, placé du côté du nom.","Avant le nom, a se colle à la fin de l'adjectif. Après le nom, a se colle au début."],"source":"Wikipédia, Na'vi grammar, Wikibooks, Na'vi","verifie":"2026-11-12","exemples":[{"navi":"tsawla tute","fr":"une grande personne"},{"navi":"tute atsawl","fr":"une grande personne"},{"navi":"ngima kilvan","fr":"une longue rivière"},{"navi":"kilvan angim","fr":"une longue rivière"}]},"r-L5-lu":{"type":"regle","lecon":"L5","notions":["adjectifs"],"domaine":"grammaire","ordre":2,"titre":"Avec lu, pas de a","texte":["Avec lu (être), l'adjectif ne prend pas a."],"source":"Wikipédia, Na'vi grammar","verifie":"2026-11-12","exemples":[{"navi":"Tute lu tsawl.","fr":"La personne est grande."},{"navi":"Po lu lor.","fr":"Il/elle est beau/belle."},{"navi":"Po lu txur.","fr":"Il/elle est fort(e)."}]},"r-L5-invariable":{"type":"regle","lecon":"L5","notions":["adjectifs"],"domaine":"grammaire","ordre":3,"titre":"L'adjectif ne s'accorde pas","texte":["L'adjectif ne change ni au pluriel ni selon le cas."],"source":"Wikipédia, Na'vi grammar","verifie":"2026-11-12","exemples":[{"navi":"aysute atsawl","fr":"de grandes personnes"}],"correction":"La leçon donnait aytute atsawl, sans la lénition de tute."},"r-L5-le":{"type":"regle","lecon":"L5","notions":["adjectifs"],"domaine":"grammaire","ordre":4,"titre":"Le préfixe le-","texte":["le- forme un adjectif à partir de certains noms seulement : on ne peut pas l'ajouter à n'importe quel nom.","Après le nom, un adjectif en le- perd habituellement son a : lì'fya leNa'vi. Avant le nom, le a reste obligatoire."],"source":"Wikibooks, Na'vi, Na'vi in a Nutshell (LearnNavi), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"fpom → lefpom","fr":"paix → heureux, paisible"},{"navi":"lì'fya leNa'vi","fr":"la langue na'vi"},{"navi":"trr lefpom, trr alefpom","fr":"un jour paisible"},{"navi":"lefpoma trr","fr":"un jour paisible"}]},"m-naring":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"na'rìng","fr":"forêt","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-kelku":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"kelku","fr":"maison","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-txon":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"txon","fr":"nuit","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-mi":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"mì","fr":"dans, sur","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-ro":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"ro","fr":"à (un lieu)","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-ta":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"ta","fr":"de, depuis","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-ftu":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"ftu","fr":"de, depuis (en s'éloignant)","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-fa":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"fa","fr":"avec, au moyen de","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-hu":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"hu","fr":"avec (en compagnie de)","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-na":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"na","fr":"comme","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-io":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"io","fr":"au-dessus de","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-eo":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"eo","fr":"devant","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-luke":{"type":"mot","lecon":"L6","notions":["vocabulaire"],"navi":"luke","fr":"sans","categorie":"adposition","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"r-L6-place":{"type":"regle","lecon":"L6","notions":["adpositions"],"domaine":"grammaire","ordre":1,"titre":"Avant ou après le nom","texte":["Une adposition joue le rôle d'une préposition française. Elle se place avant le nom, comme un mot séparé, ou après lui, collée au nom en un seul mot.","Les deux places ont le même sens. Le choix est libre."],"source":"Wikipédia, Na'vi grammar, Na'vi in a Nutshell (LearnNavi)","verifie":"2026-11-14","exemples":[{"navi":"mì na'rìng","fr":"dans la forêt"},{"navi":"na'rìngmì","fr":"dans la forêt"},{"navi":"hu nga","fr":"avec toi"},{"navi":"ngahu","fr":"avec toi"},{"navi":"pohu","fr":"avec lui/elle"}]},"r-L6-liste":{"type":"regle","lecon":"L6","notions":["adpositions"],"domaine":"grammaire","ordre":2,"titre":"Les adpositions de la leçon","texte":["Dix adpositions courantes. La colonne Lénition indique celles qui adoucissent le mot qui suit."],"source":"Dictionnaire LearnNavi (Eana Eltu), Na'vi in a Nutshell (LearnNavi)","verifie":"2026-11-14","tableau":{"colonnes":["Adposition","Sens","Lénition"],"lignes":[["mì","dans, sur","oui"],["ro","à (un lieu)","oui"],["ta","de, depuis","non"],["ftu","de, depuis (en s'éloignant)","non"],["fa","avec, au moyen de","non"],["hu","avec (en compagnie de)","non"],["na","comme","non"],["io","au-dessus de","non"],["eo","devant","non"],["luke","sans","non"]],"navi":[0]}},"r-L6-lenition":{"type":"regle","lecon":"L6","notions":["adpositions"],"domaine":"grammaire","ordre":3,"titre":"Les adpositions qui adoucissent","texte":["Quelques adpositions entraînent la lénition du mot qui suit : fpi, ìlä, mì, nuä, ro, sko, sre et wä. Dans cette leçon, ce sont mì et ro.","La lénition n'a lieu que si l'adposition est placée devant le mot. Collée après, elle ne change rien.","La lénition touche le mot qui suit immédiatement l'adposition, même si ce n'est pas le nom : mì hivea trr, le septième jour (kivea devient hivea).","luke, hu, na, fa, ta, ftu, io et eo n'entraînent jamais de lénition."],"source":"Dictionnaire LearnNavi (Eana Eltu), Na'vi in a Nutshell (LearnNavi), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"mì ton","fr":"dans la nuit"},{"navi":"mì helku","fr":"dans la maison"},{"navi":"ro helku","fr":"à la maison"},{"navi":"kelkuro","fr":"à la maison"},{"navi":"luke tute","fr":"sans la personne"}]},"r-L6-forme":{"type":"regle","lecon":"L6","notions":["adpositions"],"domaine":"grammaire","ordre":4,"titre":"Pas de cas après une adposition","texte":["Le nom ou le pronom qui suit une adposition garde sa forme de base, sans terminaison de cas.","Le reste de la phrase suit les règles habituelles : un verbe avec objet garde son sujet à l'agentif."],"source":"Na'vi in a Nutshell (LearnNavi)","verifie":"2026-11-14","exemples":[{"navi":"Po rey luke oe.","fr":"Il/elle vit sans moi."},{"navi":"Nga hu po plltxe.","fr":"Tu parles avec lui/elle."},{"navi":"Oe tìran mì na'rìng.","fr":"Je marche dans la forêt."},{"navi":"Oel tuteti tse'a mì helku.","fr":"Je vois la personne dans la maison."}]},"m-kxani":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"kxanì","fr":"interdit","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-ftue":{"type":"mot","lecon":"L5","notions":["vocabulaire"],"navi":"ftue","fr":"facile","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-srak":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"srak","fr":"marqueur de question oui/non (en fin de phrase)","categorie":"particule","source":" laire"],"navi":"pehem","fr":"quoi ? (une action)","categorie":"interrogatif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14","variantes":["kempe"]},"m-pelihu":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"pelì'u","fr":"quel mot ?","categorie":"interrogatif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14","variantes":["lì'upe"]},"m-fifya":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"fìfya","fr":"comme ceci, de cette façon","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-fitseng":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"fìtseng","fr":"ici","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14","variantes":["fìtsenge"]},"m-tsatseng":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"tsatseng","fr":"là, à cet endroit-là","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-tsakrr":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"tsakrr","fr":"alors, à ce moment-là","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-tsatu":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"tsatu","fr":"cette personne","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-zahu":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"za'u","fr":"venir","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-kemsi":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"kem si","fr":"faire","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-tseng":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"tseng","fr":"lieu, endroit","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-krr":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"krr","fr":"moment, temps","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"m-txep":{"type":"mot","lecon":"L7","notions":["vocabulaire"],"navi":"txep","fr":"feu","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14"},"r-L7-srak":{"type":"regle","lecon":"L7","notions":["questions"],"domaine":"grammaire","ordre":1,"titre":"Les questions oui/non","texte":["Pour poser une question fermée, on ajoute srak à la fin de la phrase, ou srake au début. Le reste de la phrase ne change pas : il n'y a pas d'inversion du sujet comme en français.","On répond srane (oui) ou kehe (non).","Pour dire « avoir », on emploie lu avec le possesseur au datif : Lu ngaru tskxe, « tu as une pierre », mot à mot « à toi est une pierre ».","Pour répondre à une question négative, on se prononce sur ce qui est dit : à Nga ke lu Txewì srak? (tu n'es pas Txewì ?), on répond srane si l'on n'est pas Txewì, kehe si on l'est."],"source":"Dictionnaire LearnNavi (Eana Eltu), Wikibooks, Na'vi, Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer)","verifie":"2026-11-19","exemples":[{"navi":"Ngaru lu fpom srak?","fr":"Vas-tu bien ? (mot à mot : à toi est la paix ?)"},{"navi":"Srake nga za'u?","fr":"Viens-tu ?"},{"navi":"Lu ngaru tskxe srak?","fr":"As-tu une pierre ?"}]},"r-L7-ke":{"type":"regle","lecon":"L7","notions":["questions"],"domaine":"grammaire","ordre":2,"titre":"La négation ke","texte":["ke veut dire « ne… pas ». Il se place juste devant le mot qu'il nie, le plus souvent le verbe.","Ne pas confondre : ke nie dans la phrase, kehe veut dire « non » en réponse.","kefyak (ou kefya srak), qui vient de ke fìfya srak (« n'est-ce pas ainsi ? »), se place en fin de phrase et veut dire « n'est-ce pas ? »."],"source":"Dictionnaire LearnNavi (Eana Eltu), Na'viteri (Paul Frommer), Wikibooks, Na'vi","verifie":"2026-11-19","exemples":[{"navi":"Oe ke tìran.","fr":"Je ne marche pas."},{"navi":"Ngal ke tse'a txepit srak?","fr":"Ne vois-tu pas le feu ?"}]},"r-L7-pe":{"type":"regle","lecon":"L7","notions":["questions"],"domaine":"grammaire","ordre":3,"titre":"Les mots en pe+","texte":["Une question ouverte se forme avec pe+ et un nom courant : personne, chose, lieu, moment…","Placé devant, pe+ entraîne la lénition du nom : pe + 'u → peu, pe + tseng → peseng, pe + krr → pehrr, pe + kem → pehem. Collé après sous la forme -pe, il ne change rien : 'upe, tsengpe, krrpe, kempe.","Les deux formes ont le même sens. Le mot interrogatif peut se placer n'importe où dans la phrase.","peu interroge sur une chose (un objet, un fait, une idée) ; pehem ou kempe sur une action (« Que fais-tu ? »).","Avec nga, Nga tupe lu? peut sembler agressif : face à un inconnu, on dit Ngenga lu tupe? (leçon 13)."],"source":"Dictionnaire LearnNavi (Eana Eltu), Wikibooks, Na'vi, Na'viteri (Paul Frommer)","verifie":"2026-11-19","tableau":{"colonnes":["Devant","Après","Sens","Formé sur"],"lignes":[["pesu","tupe","qui ?","tute, personne"],["peu","'upe","quoi ? (une chose)","'u, chose"],["peseng","tsengpe","où ?","tseng, lieu"],["pehrr","krrpe","quand ?","krr, moment"],["pelun","lumpe","pourquoi ?","lun, raison"],["pefya","fyape","comment ?","fya'o, manière"],["pehem","kempe","quoi ? (une action)","kem, action"],["pelì'u","lì'upe","quel mot ?","lì'u, mot"]],"navi":[0,1]},"exemples":[{"navi":"Nga tupe lu?","fr":"Qui es-tu ?"},{"navi":"Nga za'u ftu peseng?","fr":"D'où viens-tu ?"},{"navi":"Kempe si nga?","fr":"Que fais-tu ?"},{"navi":"Oeru pelun?","fr":"Pourquoi moi ?"}]},"r-L7-reponses":{"type":"regle","lecon":"L7","notions":["questions"],"domaine":"grammaire","ordre":4,"titre":"Répondre avec fì- et tsa-","texte":["Pour répondre à une question en pe+, on emploie souvent un mot en fì- (ce… -ci) ou en tsa- (ce… -là).","tsatu s'écrit en un seul mot."],"source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-14","tableau":{"colonnes":["Question","Réponse","Sens"],"lignes":[["pefya ?","fìfya","comme ceci"],["peseng ?","fìtseng, fìtsenge","ici"],["peseng ?","tsatseng","là"],["pehrr ?","tsakrr","alors, à ce moment-là"],["pesu ?","tsatu","cette personne"]],"navi":[0,1]}},"m-prrnen":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"prrnen","fr":"bébé","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-tsmukan":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"tsmukan","fr":"frère","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-eylan":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"'eylan","fr":"ami","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-tokx":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"tokx","fr":"corps","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-u":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"'u","fr":"chose","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-kelutral":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"Kelutral","fr":"l'Arbre-Maison","categorie":"nom propre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-rrta":{"type":"mot","lecon":"L8","notions":["vocabulaire"],"navi":"'Rrta","fr":"la Terre","categorie":"nom propre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"r-L8-sons":{"type":"regle","lecon":"L8","notions":["lenition"],"domaine":"grammaire","ordre":1,"titre":"Les huit sons qui changent","texte":["La lénition adoucit la première consonne d'un mot. Seuls huit sons changent : px, tx, kx, p, t, k, ts et le coup de glotte. Les autres consonnes et les voyelles ne bougent pas.","Le coup de glotte ne disparaît pas devant ll ou rr : mì 'Rrta (sur la Terre).","Les noms propres subissent aussi la lénition : Kelutral devient Helutral après mì."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16","tableau":{"colonnes":["Avant","Après","Exemple"],"lignes":[["px, tx, kx","p, t, k","txep → mì tep"],["p, t, k","f, s, h","kelku → ro helku"],["ts","s","tsmukan → aysmukan"],["'","disparaît","'eylan → fpi eylan"]],"navi":[0,1,2]},"exemples":[{"navi":"mì tep","fr":"dans le feu"},{"navi":"fpi eylan","fr":"pour l'ami"},{"navi":"mì 'Rrta","fr":"sur la Terre"},{"navi":"Oe kelku si mì Helutral.","fr":"J'habite à l'Arbre-Maison."}]},"r-L8-nombre":{"type":"regle","lecon":"L8","notions":["lenition"],"domaine":"grammaire","ordre":2,"titre":"Lénition et nombre","texte":["Les trois préfixes de nombre entraînent la lénition : me+ (duel), pxe+ (triel) et ay+ (pluriel).","Au pluriel, quand la lénition change le mot, on peut omettre ay+ : c'est le pluriel court (sute, frrnen). Si le mot ne change pas, ay+ reste : aynantang.","Devant e ou 'e, me+ et pxe+ se fondent avec le e : me+ + 'eveng → meveng.","Exception : 'u (chose) n'a pas de pluriel court. On dit toujours ayu.","Après une adposition qui lénite, la forme adoucie sans ay+ se lit au singulier : mì sokx, « dans le corps ». Pour le pluriel, on garde ay+ : mì aysokx."],"source":"Horen leNa'vi (Kelutral.org), Reykunyu (conjugateur), Wikibooks, Na'vi","verifie":"2026-11-19","tableau":{"colonnes":["Mot","Duel","Triel","Pluriel"],"lignes":[["tute","mesute","pxesute","aysute, sute"],["po","mefo","pxefo","ayfo, fo"],["kilvan","mehilvan","pxehilvan","ayhilvan, hilvan"],["prrnen","mefrrnen","pxefrrnen","ayfrrnen, frrnen"],["nantang","menantang","pxenantang","aynantang"],["'eveng","meveng","pxeveng","ayeveng, eveng"],["'u","meu","pxeu","ayu"]],"navi":[0,1,2,3]}},"r-L8-declencheurs":{"type":"regle","lecon":"L8","notions":["lenition"],"domaine":"grammaire","ordre":3,"titre":"Adpositions et pe+","texte":["Les adpositions fpi, ìlä, mì, nuä, ro, sko, sre (et lisre, pxisre) et wä entraînent la lénition quand elles sont placées devant le mot. Collées après, elles ne changent rien : ro helku, mais kelkuro.","hu, luke, na, fa et ta n'entraînent jamais de lénition.","Le préfixe interrogatif pe+ entraîne aussi la lénition (leçon 7) : pe + krr → pehrr.","Les formes contractées avec ay+ lénitent aussi : fay+ (ces), tsay+ (ceux-là), pay+ (quels ?) : faysulfätu, tsaytele. Seuls, fì- et tsa- ne lénitent pas : fìpo, tsatu."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Adposition","Sens"],"lignes":[["fpi","pour, au bénéfice de"],["ìlä","par, via, selon"],["mì","dans, sur"],["nuä","au-delà de"],["ro","à (un lieu)"],["sko","en tant que"],["sre","avant (dans le temps)"],["wä","contre"]],"navi":[0]},"exemples":[{"navi":"ro helku, kelkuro","fr":"à la maison"},{"navi":"mì tep, txepmì","fr":"dans le feu"}]},"m-zene":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"zene","fr":"devoir","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-zenke":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"zenke","fr":"devoir ne pas (interdiction)","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-tsun":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"tsun","fr":"pouvoir, être capable de","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-new":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"new","fr":"vouloir","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-kan":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"kan","fr":"avoir l'intention de, viser","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-fmi":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"fmi","fr":"essayer","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-sngahi":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"sngä'i","fr":"commencer","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-var":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"var","fr":"continuer à","categorie":"verbe modal","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-ka":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"kä","fr":"aller, partir","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-fte":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"fte","fr":"pour que, afin que","categorie":"conjonction","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-fteke":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"fteke","fr":"de peur que","categorie":"conjonction","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-tsni":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"tsnì","fr":"que (après espérer, demander)","categorie":"conjonction","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-silpey":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"sìlpey","fr":"espérer","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-a":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"a","fr":"qui, que (relatif)","categorie":"particule","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-txo":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"txo","fr":"si (condition possible)","categorie":"conjonction","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-zun":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"zun","fr":"si (condition irréelle)","categorie":"conjonction","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-zel":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"zel","fr":"alors (après zun)","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-neto":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"neto","fr":"au loin (direction)","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-srungsi":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"srung si","fr":"aider","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-terkup":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"terkup","fr":"mourir","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-tok":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"tok","fr":"être à, occuper (un lieu)","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"m-oloeyktan":{"type":"mot","lecon":"L9","notions":["vocabulaire"],"navi":"olo'eyktan","fr":"chef de clan","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16"},"r-L9-iv":{"type":"regle","lecon":"L9","notions":["subjonctif"],"domaine":"grammaire","ordre":1,"titre":"Le subjonctif ‹iv›","texte":["‹iv› est l'infixe du subjonctif. Il va à la place des infixes de temps : k‹iv›ä → kivä, t‹iv›aron → tivaron (et non taroniv).","Il s'emploie après un verbe modal, après fte et tsnì, dans la condition txo, dans les deux parties de zun … zel, pour un souhait et pour un ordre (Kivä !, pars !)."],"source":"Na'vi in a Nutshell (LearnNavi), Reykunyu (conjugateur), Dictionnaire LearnNavi (Eana Eltu), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"Oe zene kivä.","fr":"Je dois partir."},{"navi":"'Ivong Na'vi!","fr":"Que le Na'vi s'épanouisse !"},{"navi":"Oe tivätxaw.","fr":"Que je revienne ! (souhait)"}]},"r-L9-modaux":{"type":"regle","lecon":"L9","notions":["subjonctif"],"domaine":"grammaire","ordre":2,"titre":"Les verbes modaux","texte":["Le modal se place devant le verbe, qui prend ‹iv›. Le plus souvent, il le précède directement ; le sujet peut aussi venir entre les deux : Zenke nga kivä.","Le sujet d'un modal ne prend pas -l, même si le verbe a un objet : Nga tsun kivä (et non ngal), Oe new yivom teylut. L'agentif n'est toléré que dans quelques ordres de mots, comme Oel teylut new yivom.","Le temps et l'aspect se mettent sur le modal, pas sur le verbe qui suit : oe namew tsive'a, je voulais voir.","new (vouloir) se construit comme les autres modaux, ou avec futa, qui annonce l'action voulue. Avec futa, le sujet prend -l, et l'action peut avoir son propre sujet : Oel new futa nga kivä neto (je veux que tu partes).","zenke, contraction de zene ke, exprime une interdiction : Nga zenke kivä, « tu ne dois pas partir ». « Ne pas être obligé de partir » se dit Nga ke zene kivä."],"source":"Na'vi in a Nutshell (LearnNavi), Na'viteri (Paul Frommer), Dictionnaire LearnNavi (Eana Eltu), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","tableau":{"colonnes":["Modal","Sens"],"lignes":[["zene","devoir"],["zenke","devoir ne pas"],["tsun","pouvoir"],["new","vouloir"],["kan","avoir l'intention de"],["fmi","essayer"],["sngä'i","commencer"],["var","continuer à"],["ftang","arrêter de"],["kom","oser"],["may'","essayer, tester"],["nulnew","préférer"],["sto","refuser de"]],"navi":[0]},"exemples":[{"navi":"Oe zene kivä.","fr":"Je dois partir."},{"navi":"Nga tsun kivä.","fr":"Tu peux partir."},{"navi":"Oel new futa kivä.","fr":"Je veux partir."},{"navi":"Oe new yivom teylut.","fr":"Je veux manger du teylu."},{"navi":"Oel new futa nga kivä neto.","fr":"Je veux que tu partes."},{"navi":"Var kivä ko!","fr":"Continuons d'avancer !"},{"navi":"Nga zenke kivä.","fr":"Tu ne dois pas partir."},{"navi":"Oe namew tsive'a.","fr":"Je voulais voir."}]},"r-L9-subord":{"type":"regle","lecon":"L9","notions":["subordonnees"],"domaine":"grammaire","ordre":3,"titre":"fte, tsnì et le relatif a","texte":["fte (pour que) et fteke (de peur que) : le verbe qui suit prend ‹iv›.","Avec sìlpey (espérer) ou ätxäle si (demander), on emploie tsnì (que), et non futa. Le verbe qui suit prend ‹iv›.","a relie la relative au nom. Elle peut suivre ou précéder le nom : tute a ngal tse'a, ngal tse'a a tute (la personne que tu vois). a ne s'omet jamais."],"source":"Na'vi in a Nutshell (LearnNavi), Dictionnaire LearnNavi (Eana Eltu), Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"Oe zera'u fte oe srung sivi ngaru.","fr":"Je viens pour t'aider."},{"navi":"Oe sìlpey tsnì nga 'ivì'awn ayoehu.","fr":"J'espère que tu resteras avec nous."},{"navi":"Oer smamon olo'eyktan a tìmerkup.","fr":"Je connaissais le chef de clan qui vient de mourir."}]},"r-L9-si":{"type":"regle","lecon":"L9","notions":["subordonnees"],"domaine":"grammaire","ordre":4,"titre":"Les conditions : txo et zun","texte":["txo (si) pose une condition possible. Son verbe prend ‹iv›. La suite, souvent introduite par tsakrr (alors), prend le temps qui convient. tsakrr peut être omis.","zun … zel (si … alors) pose une condition irréelle, contraire aux faits. Les deux verbes prennent un infixe du subjonctif. zel ne s'omet pas."],"source":"Na'vi in a Nutshell (LearnNavi), Na'viteri (Paul Frommer), Reykunyu (conjugateur), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-16","tableau":{"colonnes":["Infixe","Sens","Exemple"],"lignes":[["‹iv›","présent (un état)","livu : serait"],["‹irv›","présent (une action en cours)","kirvä : serait en train d'aller"],["‹imv›, ‹ilv›","passé","limvu : aurait été"],["‹ìyev›","futur","zìyevup : tomberait"]],"navi":[0,2]},"exemples":[{"navi":"Txo nga kivä Zahatxum, tsakrr nga tayerkup.","fr":"Si tu vas à Z'ha'dum, tu mourras."},{"navi":"Txo zivup tompa, (tsakrr) ke tsun oe kivä.","fr":"S'il pleut, je ne peux pas y aller."},{"navi":"Zun zivup tompa, zel ke tsivun oe kivä.","fr":"S'il pleuvait, je ne pourrais pas y aller."},{"navi":"Zun tompa zìyevup trray, zel fo srìyevew.","fr":"S'il pleuvait demain, ils danseraient."}]},"m-kew":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"kew","fr":"zéro (0)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-aw":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"'aw","fr":"un (1)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-mune":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"mune","fr":"deux (2)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-pxey":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"pxey","fr":"trois (3)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-tsing":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"tsìng","fr":"quatre (4)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-mrr":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"mrr","fr":"cinq (5)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-pukap":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"pukap","fr":"six (6)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-kina":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"kinä","fr":"sept (7)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-vol":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"vol","fr":"huit (8)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-zam":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"zam","fr":"soixante-quatre (64)","categorie":"nombre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-vozam":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"vozam","fr":"cinq cent douze (512)","categorie":"nombre","source":"Dictionnaire ":["vocabulaire"],"navi":"zìsìt","fr":"année","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-ikran":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"ikran","fr":"ikran (banshee)","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-eyt":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"'eyt","fr":"le chiffre humain 8 (pas pour compter)","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-nayn":{"type":"mot","lecon":"L10","notions":["vocabulaire"],"navi":"nayn","fr":"le chiffre humain 9 (pas pour compter)","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"r-L10-chiffres":{"type":"regle","lecon":"L10","notions":["nombres"],"domaine":"grammaire","ordre":1,"titre":"Les chiffres et les puissances de huit","texte":["Le Na'vi compte en base huit : vol vaut 8, zam vaut 64 (8 × 8), vozam 512, zazam 4 096.","Chaque chiffre a une forme préfixe, qui multiplie la puissance de huit (me-vol = 2 × 8), et une forme suffixe, qui s'ajoute (vo-mun = 8 + 2).","Les suffixes sont adoucis par la lénition (leçon 8) : pxey → -pey, tsìng → -sìng, pukap → -fu, kinä → -hin.","1 n'a pas de forme préfixe : 8 se dit vol et 64 zam.","Aucune source ne donne de mot au-delà de zazam : le plus grand nombre exprimable est 77777 en octal, soit 32 767."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu), Reykunyu, générateur de nombres","verifie":"2026-11-19","tableau":{"colonnes":["Valeur","Na'vi","Préfixe","Suffixe"],"lignes":[["0","kew","—","—"],["1","'aw","—","-aw"],["2","mune","me-","-mun"],["3","pxey","pxe-","-pey"],["4","tsìng","tsì-","-sìng"],["5","mrr","mrr-","-mrr"],["6","pukap","pu-","-fu"],["7","kinä","ki-","-hin"],["8","vol","vo-","—"],["64","zam","za-","—"],["512","vozam","voza-","—"],["4 096","zazam","zaza-","—"]],"navi":[1,2,3]}},"r-L10-former":{"type":"regle","lecon":"L10","notions":["nombres"],"domaine":"grammaire","ordre":2,"titre":"Former un nombre","texte":["On écrit de la plus grande puissance à la plus petite : (préfixe) za(m) + (préfixe) vo(l) + suffixe.","Le l de vol et le m de zam, vozam ou zazam tombent devant tous les suffixes sauf -aw : volaw, zamaw, mais vomun, zamun, zavol.","Pour lire un nombre, refais le calcul : vomun = 8 + 2 = 10. Attention, « 10 » écrit en octal vaut 8.","Divergence : devant un préfixe multiplicateur, le document LearnNavi en français fait tomber le m de zam (kizapuvomun), le dictionnaire le garde (zamtsìvosìng = 100). Tinan accepte les deux."],"source":"Horen leNa'vi (Kelutral.org), Reykunyu, générateur de nombres, Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Nombre","Calcul","Na'vi"],"lignes":[["9","8 + 1","volaw"],["10","8 + 2","vomun"],["15","8 + 7","vohin"],["16","2 × 8","mevol"],["42","5 × 8 + 2","mrrvomun"],["53","6 × 8 + 5","puvomrr"],["65","64 + 1","zamaw"],["72","64 + 8","zavol"],["137","2 × 64 + 8 + 1","mezavolaw"],["384","6 × 64","puzam"],["498","7 × 64 + 6 × 8 + 2","kizapuvomun"]],"navi":[2]}},"r-L10-ordinaux":{"type":"regle","lecon":"L10","notions":["nombres"],"domaine":"grammaire","ordre":3,"titre":"Ordinaux, fractions et fois","texte":["Le suffixe -ve forme les ordinaux. Ils s'emploient comme des adjectifs : mrrvea ikran, le cinquième ikran.","Les fractions remplacent -ve par -pxì : tsìpxì (un quart), vopxì (un huitième). Formes à part : mawl (une moitié), pan (un tiers), mefan (deux tiers, duel de pan).","Quand le numérateur dépasse un, on met le nombre avec -a- devant la fraction : munea mrrpxì, deux cinquièmes.","'awlo (une fois), melo (deux fois), pxelo (trois fois) et fralo (chaque fois) sont des mots composés avec alo (fois).","Au-delà de trois fois, on emploie alo (fois) avec le nombre attributif : alo amrr, cinq fois. nì- + ordinal forme un adverbe : nì'awve (premièrement), nìmuve (deuxièmement)."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Nombre","Ordinal","Fraction"],"lignes":[["1","'awve","—"],["2","muve","mawl"],["3","pxeyve","pan"],["4","tsìve","tsìpxì"],["5","mrrve","mrrpxì"],["6","puve","pupxì"],["7","kive","kipxì"],["8","volve","vopxì"],["10","vomuve","—"],["64","zave","—"]],"navi":[1,2]},"exemples":[{"navi":"mrrvea ikran","fr":"le cinquième ikran"},{"navi":"munea mrrpxì","fr":"deux cinquièmes"},{"navi":"mefan","fr":"deux tiers"}]},"r-L10-noms":{"type":"regle","lecon":"L10","notions":["nombres"],"domaine":"grammaire","ordre":4,"titre":"Nombres et noms","texte":["Le nombre se relie au nom par -a-, comme un adjectif, et le nom reste au singulier : mrra zìsìt, cinq années (et non mrra ayzìsìt).","Comme un adjectif, le nombre peut aussi suivre le nom : mrra utral ou utral amrr, cinq arbres.","'eyt (8) et nayn (9) servent seulement à citer des chiffres humains, comme un numéro de téléphone. Pour compter, on dit vol et volaw."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"mrra zìsìt","fr":"cinq années"},{"navi":"mrra ikran","fr":"cinq ikrans"},{"navi":"utral amrr","fr":"cinq arbres"}]},"m-kawtu":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"kawtu","fr":"personne (aucune personne)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-keu":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"ke'u","fr":"rien","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-kawkrr":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"kawkrr","fr":"jamais","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-kawtseng":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"kawtseng","fr":"nulle part","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-frapo":{"type"
