,"categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-nihawng":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"nìhawng","fr":"trop","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-niteng":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"nìteng","fr":"aussi, de même","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-kop":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"kop","fr":"aussi, en plus","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-keng":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"keng","fr":"même","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-tik":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"tìk","fr":"immédiatement","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-niftue":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"nìftue","fr":"facilement","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-ninavi":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"nìNa'vi","fr":"à la manière des Na'vi, en Na'vi","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-niawve":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"nì'awve","fr":"premièrement","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-eyawr":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"eyawr","fr":"correct","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-keyawr":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"keyawr","fr":"incorrect","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-ngay":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"ngay","fr":"vrai","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-ewan":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"'ewan","fr":"jeune","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"m-pamrelsi":{"type":"mot","lecon":"L11","notions":["vocabulaire"],"navi":"pamrel si","fr":"écrire","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-17"},"r-L11-ke":{"type":"regle","lecon":"L11","notions":["negation"],"domaine":"grammaire","ordre":1,"titre":"Placer ke","texte":["ke se place devant le mot qu'il nie, le plus souvent le verbe. kehe veut dire « non » en réponse.","Avec un verbe en si, ke se place juste devant si : po pamrel ke si, il n'écrit pas.","Avec un modal, la place de ke change le sens : devant le modal, il nie le modal ; devant le verbe, il nie l'action.","Pour un ordre négatif, on emploie rä'ä, et non ke. Il se place d'habitude devant le verbe. Placé après, il insiste.","Avec un verbe en si, rä'ä se place entre le nom et si, comme ke : Txopu rä'ä si!, n'aie pas peur !"],"source":"Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Na'vi","Sens"],"lignes":[["ke zene kivä","ne pas être obligé de partir"],["zene ke kivä, zenke kivä","devoir ne pas partir"],["po ke tsun yivom","il ne peut pas manger"],["po tsun ke yivom","il peut ne pas manger"]],"navi":[0]},"exemples":[{"navi":"Po pamrel ke si.","fr":"Il n'écrit pas."},{"navi":"Rä'ä hahaw!","fr":"Ne dors pas !"},{"navi":"Oeti 'ampi rä'ä!","fr":"Ne me touche pas !"}]},"r-L11-mots":{"type":"regle","lecon":"L11","notions":["negation"],"domaine":"grammaire","ordre":2,"titre":"Mots négatifs et double négation","texte":["Les mots en fra- (tout) et en kaw- (aucun) complètent la famille de fì- et tsa- (leçon 7).","Avec un mot négatif, ke reste obligatoire devant le verbe, un peu comme le « ne » français : Ke'u ke lu ngay, rien n'est vrai.","ke li veut dire « pas encore », avec ke aussi devant le verbe. ke… kaw'it veut dire « pas… du tout ».","Quand on nie un mot en fra-, le verbe est nié aussi : Ke frapo ke tslolam, tous n'ont pas compris (certains seulement)."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Na'vi","Sens"],"lignes":[["frapo","tout le monde"],["kawtu","personne"],["fra'u","tout"],["ke'u","rien"],["set","maintenant"],["frakrr","toujours"],["kawkrr","jamais"],["fratseng","partout"],["kawtseng","nulle part"]],"navi":[0]},"exemples":[{"navi":"Ke'u ke lu ngay.","fr":"Rien n'est vrai."},{"navi":"Fo ke li ke polähem.","fr":"Ils ne sont pas encore arrivés."},{"navi":"Fo ke lu 'ewan kaw'it.","fr":"Ils ne sont pas jeunes du tout."},{"navi":"Ke frapo ke tslolam.","fr":"Tous n'ont pas compris (certains seulement)."}]},"r-L11-keadj":{"type":"regle","lecon":"L11","notions":["negation"],"domaine":"grammaire","ordre":3,"titre":"Le préfixe ke- des adjectifs","texte":["ke- forme le contraire d'un adjectif : eyawr (correct) → keyawr (incorrect).","Devant un adjectif en le-, celui-ci se réduit à -l- : lefpomtokx (en bonne santé) → kelfpomtokx (en mauvaise santé), comme dans keltsun (impossible).","ke- ne s'emploie pas qu'avec des adjectifs. Sur un adjectif court, l'accent passe sur ke- : teng (même) → keteng (différent)."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"keyawr","fr":"incorrect"},{"navi":"kelfpomtokx","fr":"en mauvaise santé"},{"navi":"keltsun","fr":"impossible"},{"navi":"keteng","fr":"différent"}]},"r-L11-adverbes":{"type":"regle","lecon":"L11","notions":["adverbes"],"domaine":"grammaire","ordre":4,"titre":"Les adverbes","texte":["nì- forme des adverbes à partir de noms, de pronoms, d'adjectifs et de verbes : nìftue (facilement), nìayfo (comme eux), nì'awve (premièrement). Par exemple tam (suffire) → nìtam (assez).","nìfya'o + adjectif forme un adverbe de manière : Poe poltxe nìfya'o alaw, elle a parlé clairement.","Les adverbes de degré et de quantité suivent le plus souvent le mot qu'ils modifient. Avec un duel, nìwotx veut dire « tous les deux ».","fìtxan ou nìftxan… kuma : « si… que », avec kuma juste après. 'ul… 'ul : plus… plus ; nän… nän : moins… moins."],"source":"Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Adverbe","Sens"],"lignes":[["nìtxan","très, beaucoup"],["nìwotx","tous, entièrement"],["nìngay","vraiment"],["nìhawng","trop"],["nìteng","aussi, de même"],["kop","aussi, en plus"],["li","déjà"],["keng","même"],["tìk","immédiatement"]],"navi":[0]},"exemples":[{"navi":"Irayo nìtxan.","fr":"Merci beaucoup."},{"navi":"Mefo nìwotx yolom.","fr":"Ils ont mangé tous les deux."},{"navi":"Ngeyä lì'fya leNa'vi txantsan lu nìngay.","fr":"Ton Na'vi est vraiment excellent."},{"navi":"Peyä menarisì nìhawng lu hì'i.","fr":"Ses yeux sont trop petits."},{"navi":"Lu poe sevin nìftxan kuma yawne slolu oer.","fr":"Elle était si belle que je suis tombé amoureux d'elle."}]},"m-tswayon":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"tswayon","fr":"voler (dans les airs)","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-fyawintxu":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"fyawìntxu","fr":"guider","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tungzup":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"tungzup","fr":"lâcher","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-txewk":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"txewk","fr":"gourdin, massue","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-atan":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"atan","fr":"lumière","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-rusey":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"rusey","fr":"vivant","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-kerusey":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"kerusey","fr":"mort","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-txantslusam":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"txantslusam","fr":"sage","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tirey":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"tìrey","fr":"la vie","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-rol":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"rol","fr":"chanter","categorie":"verbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-yomting":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"yomtìng","fr":"nourrir","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-oho":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"'o'","fr":"amusant, excitant","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-palulukan":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"palulukan","fr":"thanator","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-teylu":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"teylu","fr":"larve de scarabée (teylu)","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-koren":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"koren","fr":"règle","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-awsiteng":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"'awsiteng","fr":"ensemble","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-lehrrap":{"type":"mot","lecon":"L12","notions":["vocabulaire"],"navi":"lehrrap","fr":"dangereux","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"r-L12-participes":{"type":"regle","lecon":"L12","notions":["participes"],"domaine":"grammaire","ordre":1,"titre":"Les participes ‹us› et ‹awn›","texte":["Un participe fait d'un verbe un adjectif. ‹us› (participe actif) décrit celui qui fait l'action : tusaron, qui chasse. ‹awn› (participe passif) décrit ce qui la subit : tawnungzup, lâché.","Ce sont des infixes de position 1, comme ‹iv› (leçon 9) : tsw‹us›ayon, r‹us›ey, t‹awn›ungzup.","‹awn› ne se forme que sur un verbe transitif : tawnaron (chassé), yawnom (mangé). On l'évite sur tswayon, rey ou tìran."],"source":"Horen leNa'vi (Kelutral.org), Reykunyu (conjugateur), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Verbe","Sens","‹us›","‹awn›"],"lignes":[["tswayon","voler","tswusayon","—"],["fyawìntxu","guider","fyawusìntxu","—"],["rey","vivre","rusey","—"],["tungzup","lâcher","tusungzup","tawnungzup"],["taron","chasser","tusaron","tawnaron"],["yom","manger","yusom","yawnom"]],"navi":[0,2,3]},"exemples":[{"navi":"tswusayona ikran","fr":"un ikran qui vole"},{"navi":"atan afyawusìntxu","fr":"une lumière qui guide"},{"navi":"tawnungzupa txewk","fr":"un gourdin lâché"},{"navi":"Palulukan atusaron lu lehrrap.","fr":"Le thanator qui chasse est dangereux."}]},"r-L12-emploi":{"type":"regle","lecon":"L12","notions":["participes"],"domaine":"grammaire","ordre":2,"titre":"Employer un participe","texte":["Un participe s'emploie toujours avec -a-, devant ou après le nom, comme un adjectif (leçon 5). Il ne peut jamais être attribut : on ne dit pas Ikran lu tswusayon.","Exception : quelques mots dérivés qui contiennent un participe peuvent suivre lu : Lu nga txantslusam, tu es sage.","Un participe ne prend aucun infixe de temps, d'aspect ni de mode. Pour situer l'action dans le temps, on peut employer une relative avec a (leçon 9) : olo'eyktan a tìmerkup.","Avec un verbe en si, l'infixe va dans si et le tout compte comme un seul mot : srung-susia tute ou tute asrung-susi, une personne qui aide.","ke- donne le contraire, l'accent passant en général sur ke- : rusey (vivant) → kerusey (mort)."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"Lu nga txantslusam.","fr":"Tu es sage."},{"navi":"tute asrung-susi","fr":"une personne qui aide"},{"navi":"kerusey","fr":"mort"}]},"r-L12-gerondif":{"type":"regle","lecon":"L12","notions":["gerondif"],"domaine":"grammaire","ordre":3,"titre":"Le gérondif","texte":["tì- + ‹us› fait d'un verbe un nom d'action : rol → tìrusol, le fait de chanter. Tous les verbes en forment un, sauf les verbes en si.","Dans un verbe composé, tì- se place au début et ‹us› dans la partie verbale : yomtìng (nourrir) → tìyomtusìng.","Ne pas confondre tìrey (la vie, avec tì- seul) et tìrusey (le fait de vivre).","Un gérondif peut prendre un adverbe, mais ni sujet ni objet. Pour donner un objet à l'action, on emploie fwa.","Selon Na'vi in a Nutshell (le Horen n'en parle pas), il peut avoir un possesseur : Peyä tìrusol lu lor."],"source":"Horen leNa'vi (Kelutral.org), Na'vi in a Nutshell (LearnNavi), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"Tìyusom 'o' lu.","fr":"Manger, c'est amusant."},{"navi":"Fwa yom teylut 'o' lu.","fr":"Manger du teylu, c'est amusant."},{"navi":"Koren a'awve tìruseyä 'awsiteng","fr":"la première règle de la vie ensemble"},{"navi":"Peyä tìrusol lu lor.","fr":"Sa façon de chanter est belle."}]},"m-ohe":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"ohe","fr":"je (honorifique)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-ngenga":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"ngenga","fr":"tu (honorifique)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-poho":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"poho","fr":"il, elle (honorifique)","categorie":"pronom","source":"Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19"},"m-pohe":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"pohe","fr":"elle (honorifique)","categorie":"pronom","source":"Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19"},"m-pohan":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"pohan","fr":"il (honorifique)","categorie":"pronom","source":"Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19"},"m-henga":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"henga","fr":"politesse formelle","categorie":"nom","source":"Na'viteri (Paul Frommer)","verifie":"2026-11-19"},"m-lifyeng":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"lì'fyeng","fr":"langage honorifique","categorie":"nom","source":"Na'viteri (Paul Frommer)","verifie":"2026-11-19"},"m-ma":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"ma","fr":"ô (vocatif, devant un nom)","categorie":"particule","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-kxi":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"kxì","fr":"salut (familier)","categorie":"interjection","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-nang":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"nang","fr":"particule de surprise, d'exclamation ou d'encouragement","categorie":"particule","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-pak":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"pak","fr":"particule de dédain","categorie":"particule","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-muntxatu":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"muntxatu","fr":"époux, épouse","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tsulfatu":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"tsulfätu","fr":"maître, expert","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tikangkem":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"tìkangkem","fr":"travail","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-meuia":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"meuia","fr":"honneur","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tifmetok":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"tìfmetok","fr":"épreuve, test","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-emzahu":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"emza'u","fr":"réussir (une épreuve)","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-atxalesi":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"ätxäle si","fr":"demander (avec tsnì)","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-uniltaron":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"Uniltaron","fr":"la Chasse du Rêve","categorie":"nom propre","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tsmuk":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"tsmuk","fr":"frère ou sœur","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tsmuke":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"tsmuke","fr":"sœur","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-eyk":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"eyk","fr":"mener","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-efu":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"'efu","fr":"ressentir","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-pum":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"pum","fr":"celui, celle (déjà mentionné)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tsahu":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"tsa'u","fr":"cela","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","variantes":["tsaw"]},"m-niltsan":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"nìltsan","fr":"bien","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-upxare":{"type":"mot","lecon":"L13","notions":["vocabulaire"],"navi":"'upxare","fr":"message","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"r-L13-pronoms":{"type":"regle","lecon":"L13","notions":["honorifique"],"domaine":"grammaire","ordre":1,"titre":"Les pronoms honorifiques","texte":["Le Na'vi a un registre honorifique, avec ses propres pronoms. ngenga est le « tu » de politesse, ohe le « je » honorifique.","À la 3e personne : poho (il ou elle), pohe (elle), pohan (il). Frommer les dit assez rares, et les sources ne leur donnent pas de duel ni de pluriel.","Ils prennent les terminaisons habituelles : ohel, oheru, ngengeyä (comme nga donne ngeyä). Le génitif de poho n'est pas connu avec certitude.","Pour le « nous » inclusif, les formes en oheng sont la norme. On peut aussi dire ohe ngengasì, moi et toi."],"source":"Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer), Dictionnaire LearnNavi (Eana Eltu), Reykunyu (conjugateur)","verifie":"2026-11-19","tableau":{"colonnes":["Personne","Singulier","Duel","Triel","Pluriel"],"lignes":[["je, nous (exclusif)","ohe","mohe","pxohe","ayohe"],["nous (inclusif)","—","oheng","pxoheng","ayoheng"],["tu, vous","ngenga","mengenga","pxengenga","ayngenga"]],"navi":[1,2,3,4]},"exemples":[{"navi":"Muntxatul ngengeyä tuyok pesenget?","fr":"Où est ton époux (ton épouse) ?"},{"navi":"Sìfmetokit emzola'u ohel.","fr":"J'ai réussi les épreuves."}]},"r-L13-uy":{"type":"regle","lecon":"L13","notions":["honorifique"],"domaine":"grammaire","ordre":2,"titre":"L'infixe cérémoniel ‹uy›","texte":["‹uy› rend un verbe formel. C'est un infixe de position 2, comme ‹ei› et ‹äng› : il se met dans la dernière syllabe du verbe, tar‹uy›on, t‹uy›ok, l‹uy›u.","Dans un verbe d'une syllabe, il vient après un infixe de position 1 : ‹ol› + ‹uy› + eyk donne oluyeyk.","Dans un verbe composé, il va dans la partie verbale : yomtuyìng. Dans un verbe en si, il va dans si : ätxäle suyi.","Ne pas confondre avec ‹ei› : dans Oel ngati kameie, ‹ei› marque une attitude positive, pas la formalité."],"source":"Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer), Reykunyu (conjugateur)","verifie":"2026-11-19","tableau":{"colonnes":["Verbe","‹uy›","‹ol› + ‹uy›"],"lignes":[["taron","taruyon","tolaruyon"],["eyk","uyeyk","oluyeyk"],["yomtìng","yomtuyìng","yomtoluyìng"]],"navi":[0,1,2]},"exemples":[{"navi":"Faysulfätuä tìkangkem oheru meuia luyu nìngay.","fr":"Le travail de ces experts est vraiment un honneur pour moi."},{"navi":"Ätxäle suyi ohe pivawm, muntxatul ngengeyä tuyok pesenget?","fr":"Si je puis me permettre, où est ton époux ?"}]},"r-L13-emploi":{"type":"regle","lecon":"L13","notions":["honorifique"],"domaine":"grammaire","ordre":3,"titre":"Quand employer le registre honorifique","texte":["henga, c'est la politesse formelle ; lì'fyeng, le langage honorifique. On l'emploie dans les situations formelles : un moment solennel, la rencontre d'une personne célèbre.","Le plus formel : un pronom honorifique et ‹uy› ensemble. Un seul des deux : formel, mais moins.","Une fois le ton formel posé, il n'est pas nécessaire de répéter ‹uy› sur chaque verbe.","Hors des situations formelles, ce registre peut paraître guindé. Entre amis : Henga rä'ä si, ma tsmuk, ne sois pas si formel."],"source":"Horen leNa'vi (Kelutral.org), Na'viteri (Paul Frommer)","verifie":"2026-11-19","exemples":[{"navi":"Sìfmetokit emzola'u ohel. Ätxäle si tsnì livu oheru Uniltaron.","fr":"J'ai réussi les épreuves. Je demande respectueusement la Chasse du Rêve."},{"navi":"Henga rä'ä si, ma tsmuk.","fr":"Ne sois pas si formel, frère (ou sœur)."}]},"r-L13-vocatif":{"type":"regle","lecon":"L13","notions":["vocatif"],"domaine":"grammaire","ordre":4,"titre":"Le vocatif ma","texte":["Pour s'adresser à quelqu'un, on place ma juste devant son nom ou son titre : ma Tsu'tey, ma oeyä eylan.","Il est obligatoire avec une personne (et avec Eywa), facultatif avec un animal.","Le vocatif est le plus souvent en début ou en fin de phrase, mais il peut aussi se glisser au milieu : Nga, ma Neytiri, plltxe nìltsan.","Dans une question en srak, il vient après srak. Avec plusieurs personnes, on ne le répète pas : ma smukan sì smuke."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"Ma Tsu'tey, kempe si nga?","fr":"Tsu'tey, que fais-tu ?"},{"navi":"Ngaru lu fpom srak, ma Txewì?","fr":"Tu vas bien, Txewì ?"},{"navi":"Oel ayngati kameie, ma oeyä eylan.","fr":"Je vous vois, mes amis."},{"navi":"Nga, ma Neytiri, plltxe nìltsan.","fr":"Toi, Neytiri, tu parles bien."}]},"r-L13-familier":{"type":"regle","lecon":"L13","notions":["familier"],"domaine":"grammaire","ordre":5,"titre":"Le registre familier","texte":["À l'oral familier, on peut omettre lu, tok et pum, sans obligation. Le verbe 'efu (ressentir) ne s'omet pas.","Quand tok tombe, les terminaisons restent : tok est transitif, d'où pol et pesenget.","Formes courtes : kxì pour kaltxì ; fay+ pour fì- + ay+ (fìay+ en langage soigné) ; ngey pour ngeyä ; spoli pour säpoli.","tsaw, forme courte de tsa'u, peut prendre une postposition (tsawfa), mais pas de cas (pas de tsawl).","Ce n'est pas une question de registre : oe se prononce « we » dès qu'il n'est pas en fin de mot (oel se dit « wel »), sauf dans moe et pxoe."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Forme pleine","Familier","Sens"],"lignes":[["Nga lu pesu?","Nga pesu?","Qui es-tu ?"],["Pol tok pesenget?","Pol pesenget?","Où est-il ?"],["Fìtsko lu pum oeyä.","Fìtsko lu oeyä.","Cet arc est à moi."]],"navi":[0,1]},"exemples":[{"navi":"ngey 'upxaret","fr":"ton message (objet)"},{"navi":"tsawfa","fr":"avec ça"}]},"r-L13-argot":{"type":"regle","lecon":"L13","notions":["familier"],"domaine":"grammaire","ordre":6,"titre":"Argot, nang et pak","texte":["En argot, on peut glisser ‹äng› ou ‹ei› dans srane et kehe, dans la deuxième syllabe : sran‹äng›e, keh‹ei›e. Le Horen ne les traduit pas ; ‹äng› marque une attitude négative, ‹ei› une attitude positive.","nang, toujours en fin de phrase, marque la surprise, l'exclamation ou l'encouragement, souvent après nìngay, nìtxan ou fìtxan.","pak, toujours en fin de phrase, marque le dédain.","nang et pak ne sont pas de l'argot : ce sont des particules ordinaires."],"source":"Horen leNa'vi (Kelutral.org)","verifie":"2026-11-19","exemples":[{"navi":"Txantsana sìpawm apxay fìtxan lu ngaru nang!","fr":"Tu as tant d'excellentes questions !"},{"navi":"Tsaw ke ley kaw'it pak!","fr":"Ça ne vaut rien du tout !"}]},"m-kiyevame":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"kìyevame","fr":"au revoir, à bientôt","categorie":"interjection","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-hayalovay":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"hayalovay","fr":"à la prochaine","categorie":"interjection","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-syaw":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"syaw","fr":"appeler, nommer","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-fko":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"fko","fr":"on (sujet non précisé)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-fipo":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"fìpo","fr":"celui-ci, celle-ci (une personne)","categorie":"pronom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-txayo":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"txayo","fr":"plaine, terrain dégagé","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tut":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"tut","fr":"particule de continuation (et toi ?)","categorie":"particule","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-salew":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"salew","fr":"avancer, aller","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-polpxay":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"polpxay","fr":"combien ?","categorie":"interrogatif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-numeyu":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"numeyu","fr":"élève, étudiant","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-taronyu":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"taronyu","fr":"chasseur","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-karyu":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"karyu","fr":"enseignant","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-niprrte":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"nìprrte'","fr":"avec plaisir, volontiers","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-rutxe":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"rutxe","fr":"s'il te plaît","categorie":"interjection","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-hitxoa":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"hìtxoa","fr":"excuse-moi (petite excuse)","categorie":"interjection","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-ngaytxoa":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"ngaytxoa","fr":"désolé (je reconnais ma faute)","categorie":"interjection","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-txoa":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"txoa","fr":"pardon","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tslam":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"tslam","fr":"comprendre","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-leyn":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"leyn","fr":"répéter","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-ral":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"ral","fr":"sens, signification","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-swawtsyip":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"swawtsyìp","fr":"petit instant","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-fpil":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"fpìl","fr":"penser, réfléchir","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-kemum":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"kemum","fr":"je ne sais pas (ke omum)","categorie":"expression","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-fnan":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"fnan","fr":"être bon en","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-lifya":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"lì'fya","fr":"langue","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-lenavi":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"leNa'vi","fr":"des Na'vi, na'vi","categorie":"adjectif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-ftia":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"ftia","fr":"étudier","categorie":"verbe transitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-nioho":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"nì'o'","fr":"de façon amusante","categorie":"adverbe","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-tsray":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"tsray","fr":"village","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-txampay":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"txampay","fr":"océan, mer","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-sim":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"sim","fr":"être près de","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-sla":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"slä","fr":"mais","categorie":"conjonction","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-kelkusi":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"kelku si","fr":"habiter","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-ongokx":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"'ongokx","fr":"naître","categorie":"verbe intransitif","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"m-yerik":{"type":"mot","lecon":"L14","notions":["vocabulaire"],"navi":"yerik","fr":"hexapède (yerik)","categorie":"nom","source":"Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19"},"r-L14-transitivite":{"type":"regle","lecon":"L14","notions":["alignement"],"domaine":"grammaire","ordre":1,"titre":"La transitivité, phrase par phrase","texte":["yom (manger) est transitif. Mais c'est la phrase entière, et non le verbe seul, qui décide si le sujet prend -l.","Avec un objet exprimé, le sujet prend -l et l'objet -t : Oel yom teylut.","Quand l'objet n'a pas d'importance, on ne l'exprime pas et le sujet reste sans terminaison : Oe taron, je chasse.","Quand l'objet est seulement sous-entendu par le contexte, le sujet garde -l : « Ngal ke tse'a txepit srak? » « Oel tse'a. »","Avec un modal, le sujet reste sans -l, même si un objet suit : Oe new yivom teylut. L'agentif n'est toléré que dans quelques ordres de mots, comme Oel teylut new yivom."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","tableau":{"colonnes":["Situation","Sujet","Exemple"],"lignes":[["Avec un objet","-l","Oel yom teylut."],["Objet sans importance","sans terminaison","Oe taron."],["Objet sous-entendu","-l","Oel tse'a."],["Avec un modal","sans terminaison","Oe new yivom teylut."]],"navi":[2]},"exemples":[{"navi":"Oel yom teylut.","fr":"Je mange du teylu."},{"navi":"Oe taron.","fr":"Je chasse."},{"navi":"Oel tse'a.","fr":"Je (le) vois."},{"navi":"Oe new yivom teylut.","fr":"Je veux manger du teylu."}]},"r-L14-saluer":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":2,"titre":"Saluer et prendre congé","texte":["Oel ngati kameie est une salutation familière : kame, voir au sens profond, avec ‹ei›, une attitude positive.","Oe zene hivum (je dois partir) vient du guide Kelutral : zene suivi de h‹iv›um, avec oe sans -l puisque zene est un modal."],"source":"Dictionnaire LearnNavi (Eana Eltu), Kelutral.org","verifie":"2026-11-19","exemples":[{"navi":"Kaltxì!","fr":"Bonjour !"},{"navi":"Kxì!","fr":"Salut ! (familier)"},{"navi":"Oel ngati kameie.","fr":"Je te vois. (salutation familière)"},{"navi":"Kìyevame!","fr":"Au revoir, à bientôt !"},{"navi":"Hayalovay!","fr":"À la prochaine !"},{"navi":"Eywa ngahu!","fr":"Au revoir, qu'Eywa soit avec toi !"},{"navi":"Oe zene hivum!","fr":"Je dois partir !"}]},"r-L14-connaissance":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":3,"titre":"Faire connaissance","texte":["fko veut dire « on » : Fyape fko syaw ngar?, « comment est-ce qu'on t'appelle ? ». Dans la réponse, fko peut tomber : Oeru syaw (fko) Txewì.","oer et ngar sont les formes courtes de oeru et ngaru.","Pour demander « qui êtes-vous ? » à un inconnu, la forme honorifique est la norme : Ngenga lu tupe (pesu)? Avec nga, la question peut sembler agressive. La réponse revient aux pronoms ordinaires.","Pour présenter quelqu'un, on dit fìpo (cette personne), jamais fì'u (cette chose), ce qui serait très insultant.","-ri (après une voyelle) ou -ìri (après une consonne) marque le topique, « quant à ». tut est une particule de continuation, qu'on trouve dans les questions en retour : (Ay)Ngari tut?, et toi (et vous) ?","Les métiers en -yu : numeyu (élève), taronyu (chasseur), karyu (enseignant)."],"source":"Na'viteri (Paul Frommer), « Getting to Know You » 1 à 3 (2010), Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"Kaltxì. Ngenga lu tupe?","fr":"Bonjour. Qui êtes-vous ?"},{"navi":"Fyape fko syaw ngar?","fr":"Comment t'appelles-tu ?"},{"navi":"Oeru syaw (fko) Txewì.","fr":"Je m'appelle Txewì."},{"navi":"Nga lu Sorewn, kefyak?","fr":"Tu es Sorewn, n'est-ce pas ?"},{"navi":"Fìpo lu Ìstaw.","fr":"Voici Ìstaw."},{"navi":"Nga za'u ftu peseng?","fr":"D'où viens-tu ?"},{"navi":"Oe lu Va'ru a ftu txayo zola'u. (Ay)Ngari tut?","fr":"Je suis Va'ru, venu des plaines. Et toi (et vous) ?"},{"navi":"Ngari solalew polpxaya zìsìt?","fr":"Quel âge as-tu ?"},{"navi":"Oeri solalew zìsìt apxevol.","fr":"J'ai 24 ans."},{"navi":"Oe lu numeyu.","fr":"Je suis élève."}]},"r-L14-politesse":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":4,"titre":"Prendre des nouvelles, remercier, s'excuser","texte":["À « Ngaru lu fpom srak? », le Horen répond Oeru lu fpom. Ngaru tut? : on garde le datif de la question. Le guide Kelutral donne une version plus courte : Lu fpom, ngaru tut?","nìprrte' répond à irayo (avec plaisir), mais aussi à une demande (volontiers, bien sûr).","Trois excuses : hìtxoa, petite excuse avant de déranger ; ngaytxoa, je reconnais ma faute ; oeru txoa livu, « que le pardon soit à moi », excuse plus sérieuse."],"source":"Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu), Na'viteri (Paul Frommer), « Getting to Know You » 1 à 3 (2010), Kelutral.org","verifie":"2026-11-19","exemples":[{"navi":"Ngaru lu fpom srak?","fr":"Tu vas bien ?"},{"navi":"Oeru lu fpom. Ngaru tut?","fr":"Je vais bien. Et toi ?"},{"navi":"Irayo. — Nìprrte'.","fr":"Merci. — Avec plaisir."},{"navi":"Rutxe.","fr":"S'il te plaît."},{"navi":"Hìtxoa.","fr":"Excuse-moi."},{"navi":"Ngaytxoa.","fr":"Désolé, c'est ma faute."},{"navi":"Oeru txoa livu.","fr":"Pardonne-moi."}]},"r-L14-comprendre":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":5,"titre":"Quand on ne comprend pas","texte":["Pour plus de politesse, Frommer propose Ke tslolatsam, « je n'ai pas tout à fait compris ».","X-ri peral? (-ìri après une consonne) est la forme familière de « que veut dire X ? ». La forme soutenue est Tsalì'uri alu X, ral lu 'upe?","kemum (ke omum) est familier. Tsun pehem? est une expression toute faite : « qu'y peut-on ? »."],"source":"Na'viteri (Paul Frommer), « Getting to Know You » 1 à 3 (2010), Dictionnaire LearnNavi (Eana Eltu), Kelutral.org, Reykunyu (conjugateur)","verifie":"2026-11-19","exemples":[{"navi":"Hìtxoa, ke tslolam. Rutxe liveyn.","fr":"Pardon, je n'ai pas compris. Répète, s'il te plaît."},{"navi":"Tsun nga law sivi nì'it srak?","fr":"Peux-tu être un peu plus clair ?"},{"navi":"Tskxeri peral?","fr":"Que veut dire tskxe ?"},{"navi":"'Awa swawtsyìp. Oe fperìl.","fr":"Un petit instant, je réfléchis."},{"navi":"Kemum.","fr":"Je ne sais pas."},{"navi":"Tsun pehem?","fr":"Qu'y peut-on ?"}]},"r-L14-navi":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":6,"titre":"Parler du Na'vi","texte":["Dans Oe nìNa'vi plltxe, il n'y a pas d'objet : oe reste sans -l. Dans Ftia oel lì'fyati leNa'vi, il y a un objet (lì'fyati) : oel prend -l."],"source":"Na'viteri (Paul Frommer), « Getting to Know You » 1 à 3 (2010), Dictionnaire LearnNavi (Eana Eltu)","verifie":"2026-11-19","exemples":[{"navi":"Oe nìNa'vi plltxe.","fr":"Je parle (en) Na'vi."},{"navi":"Srake fnan ngal lì'fyati leNa'vi?","fr":"Es-tu bon en Na'vi ?"},{"navi":"Ftia oel lì'fyati leNa'vi nì'o' nìwotx!","fr":"Étudier le Na'vi, c'est super amusant pour moi !"}]},"r-L14-dialogue1":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":7,"titre":"Dialogue 1 : une rencontre","texte":["Chaque phrase vient des sources ; leur enchaînement est un montage du cours. Tsenu emploie deux lénitions dues à mì : mì sray (de tsray) et mì Helutral (de Kelutral)."],"source":"Na'viteri (Paul Frommer), « Getting to Know You » 1 à 3 (2010), Dictionnaire LearnNavi (Eana Eltu), Kelutral.org","verifie":"2026-11-19","exemples":[{"navi":"Kaltxì. Nga lu Sorewn, kefyak?","fr":"Va'ru : Bonjour. Tu es Sorewn, n'est-ce pas ?"},{"navi":"Kehe. Oer syaw fko Tsenu. Fyape fko syaw ngar?","fr":"Tsenu : Non. Je m'appelle Tsenu. Comment t'appelles-tu ?"},{"navi":"Oe lu Va'ru a ftu txayo zola'u. Ngari tut?","fr":"Va'ru : Je suis Va'ru, venu des plaines. Et toi ?"},{"navi":"Oe 'olongokx mì sray a txampayìri sim, slä set kelku si mì Helutral.","fr":"Tsenu : Je suis née dans un village près de l'océan, mais je vis maintenant à l'Arbre-Maison."},{"navi":"Ngari solalew polpxaya zìsìt?","fr":"Va'ru : Quel âge as-tu ?"},{"navi":"Oeri solalew zìsìt apxevol. Hìtxoa, oe zene hivum. Kìyevame!","fr":"Tsenu : J'ai 24 ans. Excuse-moi, je dois partir. Au revoir !"},{"navi":"Eywa ngahu!","fr":"Va'ru : Qu'Eywa soit avec toi !"}]},"r-L14-dialogue2":{"type":"regle","lecon":"L14","notions":["conversation"],"domaine":"vocabulaire","ordre":8,"titre":"Dialogue 2 : un apprenant","texte":["Chaque phrase vient des sources ; leur enchaînement est un montage du cours. On y retrouve le vocatif après srak (leçon 13), ke (leçon 11) et ‹ol› (leçon 2)."],"source":"Na'viteri (Paul Frommer), « Getting to Know You » 1 à 3 (2010), Horen leNa'vi (Kelutral.org), Dictionnaire LearnNavi (Eana Eltu), Kelutral.org","verifie":"2026-11-19","exemples":[{"navi":"Kaltxì! Ngaru lu fpom srak, ma Txewì?","fr":"A : Bonjour ! Tu vas bien, Txewì ?"},{"navi":"Oeru lu fpom. Ngaru tut?","fr":"B : Je vais bien. Et toi ?"},{"navi":"Oeru lu fpom. Srake fnan ngal lì'fyati leNa'vi?","fr":"A : Je vais bien. Es-tu bon en Na'vi ?"},{"navi":"Hìtxoa, ke tslolam. Rutxe liveyn.","fr":"B : Pardon, je n'ai pas compris. Répète, s'il te plaît."},{"navi":"Nìprrte'. Srake fnan ngal lì'fyati leNa'vi?","fr":"A : Bien sûr. Es-tu bon en Na'vi ?"},{"navi":"'Awa swawtsyìp. Oe fperìl… Kemum!","fr":"B : Un petit instant, je réfléchis… Je ne sais pas !"},{"navi":"Tsun pehem? Kìyevame!","fr":"A : Qu'y peut-on ? Au revoir !"},{"navi":"Hayalovay!","fr":"B : À la prochaine !"}]},"m-smon":{"type":"mot","lecon":"L4","notions":["vocabulaire"],"navi":"smon","fr":"êt   // ------------------------------------------------------------------ état
  const S = {
    db: null, sample: null, downloads: null,
    status: 'loading',
    lecons: {}, notions: {}, motifs: {}, elements: {}, exercices: {}, revisions: {}, erreurs: {}, seances: [],
    params: { questions: 18, seuil: 80 },
    view: 'accueil', run: null, daily: null,
    libre: null, fiche: { lecon: null, type: 'tout' }, carnetTab: 'active', lexQ: ''
  };
  let exosByEl = {}, exosByMotif = {};

  // ------------------------------------------------------------------ version autonome : base locale
  // Même interface que la base de l'artefact (doc, collection, get, set, update, add, orderBy, limit).
  // Le contenu vient de window.__CONTENU, en lecture seule. La progression va dans le localStorage,
  // une clé par document : « tinan/<chemin> ». Seul le statut d'une leçon (« validée ») est gardé pour
  // le contenu : le reste suit toujours la page, même après une mise à jour.
  function baseLocale(C) {
    const CONTENU = ['lecons', 'notions', 'motifs', 'elements', 'exercices'];
    const PREFIXE = 'tinan/';
    const MAX_SEANCES = 120; // l'app n'en lit que 60 ; au-delà, les plus anciennes sont élaguées
    let ls = null;
    try { const k = PREFIXE + '__test'; localStorage.setItem(k, '1'); localStorage.removeItem(k); ls = localStorage; }
    catch (e) { console.warn('Tinan : localStorage indisponible, la progression ne sera pas conservée.', e); }
    const mem = new Map();
    const store = {
      get(p) { const v = ls ? ls.getItem(PREFIXE + p) : mem.get(p); return v == null ? undefined : JSON.parse(v); },
      set(p, d) { const s = JSON.stringify(d); if (ls) ls.setItem(PREFIXE + p, s); else mem.set(p, s); },
      del(p) { if (ls) ls.removeItem(PREFIXE + p); else mem.delete(p); },
      keys() {
        if (!ls) return [...mem.keys()];
        const out = [];
        for (let i = 0; i < ls.length; i++) { const k = ls.key(i); if (k && k.startsWith(PREFIXE)) out.push(k.slice(PREFIXE.length)); }
        return out;
      }
    };
    const copie = (v) => (v === undefined ? undefined : JSON.parse(JSON.stringify(v)));
    const erreur = (code, cause) => Object.assign(new Error(code), { code, cause });
    const attendre = (v) => new Promise((r) => setTimeout(() => r(v), 0));
    const nouvelId = () => 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    const decoupe = (path) => { const i = path.indexOf('/'); return [path.slice(0, i), path.slice(i + 1)]; };
    function lire(path) {
      const [col, id] = decoupe(path);
      if (CONTENU.includes(col)) {
        const base = C[col] && C[col][id];
        if (base === undefined) return undefined;
        const v = copie(base);
        if (col === 'lecons') { const s = store.get(path); if (s && s.statut) v.statut = s.statut; }
        return v;
      }
      const s = store.get(path);
      if (s !== undefined) return s;
      if (col === 'parametres' && C.parametres && C.parametres[id]) return copie(C.parametres[id]);
      return undefined;
    }
    function idsDe(col) {
      if (CONTENU.includes(col)) return Object.keys(C[col] || {});
      const ids = new Set();
      store.keys().forEach((k) => { const [c, id] = decoupe(k); if (c === col && id && !id.includes('/')) ids.add(id); });
      if (col === 'parametres' && C.parametres) Object.keys(C.parametres).forEach((id) => ids.add(id));
      return [...ids];
    }
    function elaguerSeances() {
      const toutes = idsDe('seances').map((id) => ({ id, debut: (store.get('seances/' + id) || {}).debut || '' }));
      if (toutes.length <= MAX_SEANCES) return;
      toutes.sort((a, b) => (a.debut < b.debut ? 1 : a.debut > b.debut ? -1 : 0));
      toutes.slice(MAX_SEANCES).forEach((s) => store.del('seances/' + s.id));
    }
    function ecrire(path, data) {
      const [col] = decoupe(path);
      if (CONTENU.includes(col) && col !== 'lecons') throw erreur('permission_denied');
      const corps = col === 'lecons' ? { statut: data.statut } : data;
      try { store.set(path, corps); }
      catch (e) { try { elaguerSeances(); store.set(path, corps); } catch (e2) { throw erreur('quota_exceeded', e2); } }
      if (col === 'seances') elaguerSeances();
    }
    function cliche(path) {
      const v = lire(path);
      return { id: path.split('/').pop(), exists: v !== undefined, data: () => copie(v), metadata: { fromCache: true, hasPendingWrites: false } };
    }
    function docRef(path) {
      return {
        id: path.split('/').pop(), path,
        get: () => attendre(cliche(path)),
        set: (d) => {
          if (!d || typeof d !== 'object' || Array.isArray(d)) return Promise.reject(erreur('invalid_argument'));
          try { ecrire(path, copie(d)); } catch (e) { return Promise.reject(e); }
          return attendre();
        },
        update: (d) => {
          const v = lire(path);
          if (v === undefined) return Promise.reject(erreur('not_found'));
          try { ecrire(path, Object.assign(v, copie(d))); } catch (e) { return Promise.reject(e); }
          return attendre();
        },
        delete: () => { const [col] = decoupe(path); if (!CONTENU.includes(col)) store.del(path); return attendre(); }
      };
    }
    function requete(col, ordre, limite) {
      return {
        orderBy: (champ, sens) => requete(col, [champ, sens || 'asc'], limite),
        limit: (n) => requete(col, ordre, n),
        get: () => {
          let docs = idsDe(col).sort().map((id) => cliche(col + '/' + id)).filter((d) => d.exists);
          if (ordre) {
            const [f, sens] = ordre;
            docs.sort((a, b) => { const x = a.data()[f], y = b.data()[f]; return (x < y ? -1 : x > y ? 1 : 0) * (sens === 'desc' ? -1 : 1); });
          }
          if (limite) docs = docs.slice(0, limite);
          return attendre({ docs, size: docs.length, empty: !docs.length });
        },
        doc: (id) => docRef(col + '/' + (id || nouvelId())),
        add: (d) => { const r = docRef(col + '/' + nouvelId()); return r.set(d).then(() => r); }
      };
    }
    const downloads = {
      save: ({ filename, data }) => {
        const url = URL.createObjectURL(new Blob([data], { type: 'text/markdown;charset=utf-8' }));
        const a = document.createElement('a');
        a.href = url; a.download = filename || 'tinan-export.md'; a.style.display = 'none';
        document.body.appendChild(a); a.click(); a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        return Promise.resolve({ status: 'saved' });
      }
    };
    return { db: { doc: docRef, collection: (c) => requete(c) }, downloads, effacer: () => store.keys().forEach((k) => store.del(k)) };
  }
  let locale = null;

  // ------------------------------------------------------------------ base de données
  const writeQueue = {};
  let writeWarned = false;
  function write(path, data) {
    if (!S.db) return Promise.resolve();
    const body = JSON.parse(JSON.stringify(data));
    const prev = writeQueue[path] || Promise.resolve();
    const p = prev.then(() => S.db.doc(path).set(body)).catch((e) => {
      if (e && e.code === 'unavailable') return new Promise((r) => setTimeout(r, 400 + Math.random() * 600)).then(() => S.db.doc(path).set(body));
      throw e;
    }).catch((e) => {
      console.warn('write', path, e);
      if (!writeWarned) { writeWarned = true; toast(e && e.code === 'quota_exceeded' ? "La base est pleine : ta progression n'est plus enregistrée." : "Ta progression n'a pas pu être enregistrée. Vérifie ta connexion."); setTimeout(() => { writeWarned = false; }, 10000); }
    });
    writeQueue[path] = p;
    return p;
  }

  async function loadAll() {
    S.status = 'loading'; render();
    const timer = setTimeout(() => { if (S.status === 'loading') { S.status = 'slow'; render(); } }, 10000);
    try {
      // Les données lues sont figées par la base : on en fait des copies modifiables.
      const plain = (v) => JSON.parse(JSON.stringify(v || {}));
      const col = async (name) => { const snap = await S.db.collection(name).get(); const o = {}; snap.docs.forEach((d) => { o[d.id] = plain(d.data()); }); return o; };
      const [lecons, notions, motifs, elements, exercices, revisions, erreurs, params, seances] = await Promise.all([
        col('lecons'), col('notions'), col('motifs'), col('elements'), col('exercices'), col('revisions'), col('erreurs'),
        S.db.doc('parametres/general').get(),
        S.db.collection('seances').orderBy('debut', 'desc').limit(60).get()
      ]);
      clearTimeout(timer);
      Object.assign(S, { lecons, notions, motifs, elements, exercices, revisions, erreurs });
      if (params.exists) S.params = Object.assign({ questions: 18, seuil: 80 }, plain(params.data()));
      S.seances = seances.docs.map((d) => Object.assign({ id: d.id }, plain(d.data())));
      S.seances.forEach((s) => { if (!Array.isArray(s.reponses)) s.reponses = []; if (typeof s.bons !== 'number') s.bons = 0; });
      indexContent();
      S.status = Object.keys(S.lecons).length ? 'ready' : 'empty';
    } catch (e) {
      clearTimeout(timer);
      console.warn('load', e);
      S.status = 'error';
    }
    route();
  }

  function indexContent() {
    exosByEl = {}; exosByMotif = {};
    Object.keys(S.exercices).sort().forEach((id) => {
      const x = S.exercices[id];
      (exosByEl[x.element] = exosByEl[x.element] || []).push(id);
      motifsOf(x).forEach((m) => { (exosByMotif[m] = exosByMotif[m] || []).push(id); });
    });
  }
  function motifsOf(x) {
    const s = new Set();
    if (x.motif) s.add(x.motif);
    (x.options || []).forEach((o) => { if (o.motif) s.add(o.motif); });
    (x.pieges || []).forEach((p) => { if (p.motif) s.add(p.motif); });
    return s;
  }
  const lessonList = () => Object.keys(S.lecons).map((id) => Object.assign({ id }, S.lecons[id])).sort((a, b) => a.num - b.num);
  const doneLessons = () => lessonList().filter((l) => l.statut === 'faite' || l.statut === 'validee');
  const isDone = (lid) => { const l = S.lecons[lid]; return !!l && (l.statut === 'faite' || l.statut === 'validee'); };
  const lessonNum = (lid) => (S.lecons[lid] ? S.lecons[lid].num : 99);
  const hasPractice = (elId) => { const e = S.elements[elId]; return e && (e.type === 'mot' || (exosByEl[elId] || []).length > 0); };

  // ------------------------------------------------------------------ construction des séances
  function elementItem(elId, mode) {
    const e = S.elements[elId];
    const rev = S.revisions[elId];
    if (e.type === 'mot') {
      if (mode === 'bilan') return { k: 'vocab', id: elId };
      return { k: 'carte', id: elId, dir: rev && rev.dir === 'navi' ? 'fr' : 'navi' };
    }
    const xs = exosByEl[elId] || [];
    const idx = rev && typeof rev.exoIdx === 'number' ? (rev.exoIdx + 1) % xs.length : Math.floor(Math.random() * xs.length);
    return { k: 'exo', id: xs[idx] };
  }

  function exosForMotif(m) { return (exosByMotif[m] || []).filter((x) => isDone(S.exercices[x].lecon)); }
  function activeMotifs() {
    return Object.keys(S.erreurs).filter((m) => S.erreurs[m].statut === 'active' && S.motifs[m])
      .sort((a, b) => String(S.erreurs[b].derniere || '').localeCompare(String(S.erreurs[a].derniere || '')));
  }

  function roundRobin(groups, max) {
    const pools = groups.map((g) => shuffle(g));
    const out = []; const seen = new Set();
    let progressed = true;
    while (out.length < max && progressed) {
      progressed = false;
      for (const p of pools) {
        while (p.length && seen.has(p[0])) p.shift();
        if (p.length && out.length < max) { const v = p.shift(); seen.add(v); out.push(v); progressed = true; }
      }
    }
    return out;
  }

  function buildDaily() {
    const N = S.params.questions || 18;
    const td = today();
    const avail = Object.keys(S.elements).filter((id) => isDone(S.elements[id].lecon) && hasPractice(id));
    const errExos = roundRobin(activeMotifs().map(exosForMotif), Math.min(4, N));
    const errItems = errExos.map((id) => ({ k: 'exo', id }));
    const errEls = new Set(errExos.map((id) => S.exercices[id].element));
    const due = avail.filter((id) => S.revisions[id] && S.revisions[id].echeance <= td && !errEls.has(id))
      .sort((a, b) => S.revisions[a].echeance.localeCompare(S.revisions[b].echeance));
    const fresh = avail.filter((id) => !S.revisions[id] && !errEls.has(id)).sort((a, b) => {
      const ea = S.elements[a], eb = S.elements[b];
      return lessonNum(ea.lecon) - lessonNum(eb.lecon) || (ea.type === eb.type ? (ea.ordre || 0) - (eb.ordre || 0) : (ea.type === 'regle' ? -1 : 1));
    });
    const slots = N - errItems.length;
    const nNew = due.length >= slots ? Math.min(3, fresh.length) : Math.min(fresh.length, slots - due.length, 14);
    const dueTake = Math.min(due.length, slots - nNew);
    let chosen = due.slice(0, dueTake).concat(fresh.slice(0, nNew));
    let ahead = 0;
    if (chosen.length + errItems.length < N) {
      const rest = avail.filter((id) => S.revisions[id] && !chosen.includes(id) && !errEls.has(id))
        .sort((a, b) => S.revisions[a].echeance.localeCompare(S.revisions[b].echeance));
      const extra = rest.slice(0, N - chosen.length - errItems.length);
      ahead = extra.length; chosen = chosen.concat(extra);
    }
    const items = shuffle(errItems.concat(chosen.map((id) => elementItem(id, 'jour'))));
    return { items, nErr: errItems.length, nDue: dueTake + ahead, nNew, ahead };
  }

  function buildLibre(f) {
    const lessons = new Set(f.lecons);
    let pool = [];
    if (f.types.voc) {
      Object.keys(S.elements).forEach((id) => { const e = S.elements[id]; if (e.type === 'mot' && lessons.has(e.lecon)) pool.push({ k: 'carte', id, dir: Math.random() < 0.5 ? 'navi' : 'fr' }); });
    }
    Object.keys(S.exercices).forEach((id) => {
      const x = S.exercices[id]; if (!lessons.has(x.lecon)) return;
      const t = (S.notions[x.notion] || {}).type;
      if ((t === 'grammaire' && f.types.gram && f.notions.includes(x.notion)) || (t === 'phonologie' && f.types.pho) || (t === 'vocabulaire' && f.types.voc)) pool.push({ k: 'exo', id });
    });
    pool = shuffle(pool);
    if (f.prio) {
      const act = new Set(activeMotifs());
      const works = (it) => it.k === 'exo' && [...motifsOf(S.exercices[it.id])].some((m) => act.has(m));
      pool = pool.filter(works).slice(0, Math.ceil(f.count / 2)).concat(pool.filter((it) => !works(it)));
      return shuffle(pool.slice(0, f.count));
    }
    return pool.slice(0, f.count);
  }

  function buildBilan(lid) {
    const byNotion = {};
    Object.keys(S.exercices).forEach((id) => { const x = S.exercices[id]; if (x.lecon === lid) (byNotion[x.notion] = byNotion[x.notion] || []).push(id); });
    const exos = roundRobin(Object.values(byNotion), 14);
    const mots = shuffle(Object.keys(S.elements).filter((id) => S.elements[id].lecon === lid && S.elements[id].type === 'mot'));
    const nVoc = Math.min(mots.length, Math.max(4, 18 - exos.length));
    return shuffle(exos.map((id) => ({ k: 'exo', id })).concat(mots.slice(0, nVoc).map((id) => ({ k: 'vocab', id })))).slice(0, 18);
  }

  function buildCarnet(m) {
    if (m === 'all') return shuffle(roundRobin(activeMotifs().map(exosForMotif), 12)).map((id) => ({ k: 'exo', id }));
    return shuffle(exosForMotif(m)).slice(0, 10).map((id) => ({ k: 'exo', id }));
  }

  // ------------------------------------------------------------------ déroulement d'une séance
  function newId() { return 's' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function unfinished() { return S.seances.find((s) => !s.fin && Array.isArray(s.items) && s.index < s.items.length); }

  function startRun(mode, items, meta) {
    if (!items.length) { toast('Aucun exercice ne correspond à ce choix.'); return; }
    const old = unfinished();
    if (old) { old.fin = new Date().toISOString(); old.abandon = true; saveSeance(old); }
    const s = Object.assign({ id: newId(), mode, items, index: 0, bons: 0, reponses: [], debut: new Date().toISOString(), fin: null }, meta || {});
    S.seances.unshift(s);
    saveSeance(s);
    openRun(s);
  }
  function openRun(s) { S.run = { s, ui: freshUi(s.items[s.index]) }; S.view = 'seance'; if (location.hash) history.replaceState(null, '', location.pathname + location.search); render(true); }
  function saveSeance(s) { const { id, ...body } = s; return write('seances/' + id, body); }

  function freshUi(item) {
    const ui = { phase: 'question', text: '', pick: null, filled: null, flipped: false, verdict: null, why: null, report: null };
    if (!item) return ui;
    if (item.k === 'exo') {
      const x = S.exercices[item.id];
      if (!x) return ui;
      if (x.options) ui.order = shuffle(x.options.map((_, i) => i));
      if (x.type === 'formes') { ui.bank = shuffle(x.etiquettes.map((_, i) => i)); ui.filled = new Array((x.enonce.match(/___/g) || []).length).fill(null); }
    }
    return ui;
  }

  function currentItem() { const r = S.run; return r ? r.s.items[r.s.index] : null; }

  function canon(x, val) {
    if (x.phrase) return (Array.isArray(val) ? val.map(norm) : norm(val).split(' ')).filter(Boolean).sort().join(' ');
    return norm(val);
  }
  function displayAnswer(x) {
    if (x.type === 'saisie') { const r = x.reponses[0]; return x.phrase ? cap(r.join(' ')) + '.' : r; }
    if (x.type === 'formes') { let i = 0; const sol = x.solutions[0]; return x.enonce.replace(/___/g, () => sol[i++]); }
    if (x.options) return x.options[x.bonne].t;
    return '';
  }

  function evaluate(item, ui) {
    if (item.k === 'vocab') {
      const e = S.elements[item.id];
      const acc = [e.navi].concat(e.variantes || []).map(norm);
      const a = norm(ui.text);
      if (acc.includes(a)) return { ok: true, verdict: 'ok' };
      if (acc.map(noAcc).includes(noAcc(a))) return { ok: false, verdict: 'accent', attendu: e.navi };
      return { ok: false, verdict: 'ko', attendu: e.navi };
    }
    const x = S.exercices[item.id];
    if (x.type === 'saisie') {
      const a = canon(x, ui.text);
      const acc = x.reponses.map((r) => canon(x, r));
      if (acc.includes(a)) return { ok: true, verdict: 'ok' };
      if (acc.map(noAcc).includes(noAcc(a))) return { ok: false, verdict: 'accent', attendu: displayAnswer(x) };
      const p = (x.pieges || []).find((pg) => canon(x, pg.r) === a);
      return { ok: false, verdict: 'ko', attendu: displayAnswer(x), msg: p && p.msg, motif: (p && p.motif) || x.motif || null };
    }
    if (x.type === 'formes') {
      const seq = ui.filled.map((i) => x.etiquettes[i]);
      const same = (s) => x.ordreLibre ? s.slice().sort().join('|') === seq.slice().sort().join('|') : s.join('|') === seq.join('|');
      if (x.solutions.some(same)) return { ok: true, verdict: 'ok' };
      const p = (x.pieges || []).find((pg) => seq.includes(pg.contient));
      return { ok: false, verdict: 'ko', attendu: displayAnswer(x), msg: p && p.msg, motif: (p && p.motif) || x.motif || null };
    }
    const o = x.options[ui.pick];
    if (ui.pick === x.bonne) return { ok: true, verdict: 'ok' };
    return { ok: false, verdict: 'ko', attendu: x.options[x.bonne].t, msg: o.msg, motif: o.motif || x.motif || null };
  }

  function srs(elId, ok, extra) {
    const td = today();
    const r = Object.assign({ ef: 2.5, reps: 0, intervalle: 0, vu: 0 }, S.revisions[elId] || {});
    r.vu += 1;
    if (ok) { r.reps += 1; r.intervalle = r.reps === 1 ? 1 : r.reps === 2 ? 6 : Math.max(1, Math.round((r.intervalle || 1) * r.ef)); }
    else { r.reps = 0; r.intervalle = 1; r.ef = Math.max(1.3, Math.round((r.ef - 0.2) * 100) / 100); }
    r.echeance = addDays(td, r.intervalle);
    r.derniere = new Date().toISOString();
    Object.assign(r, extra || {});
    S.revisions[elId] = r;
    write('revisions/' + elId, r);
  }

  function recordErrors(x, res) {
    const now = new Date().toISOString();
    let added = null;
    if (!res.ok && res.motif && S.motifs[res.motif]) {
      const e = Object.assign({ occurrences: 0, serie: 0, origine: 'app' }, S.erreurs[res.motif] || {});
      e.statut = 'active'; e.occurrences = (e.occurrences || 0) + 1; e.serie = 0; e.derniere = now; delete e.maitrisee;
      S.erreurs[res.motif] = e; write('erreurs/' + res.motif, e); added = res.motif;
    }
    if (res.ok) {
      motifsOf(x).forEach((m) => {
        const e = S.erreurs[m];
        if (e && e.statut === 'active') {
          const n = Object.assign({}, e, { serie: (e.serie || 0) + 1 });
          if (n.serie >= 3) { n.statut = 'maitrisee'; n.maitrisee = now; }
          S.erreurs[m] = n; write('erreurs/' + m, n);
        }
      });
    }
    return added;
  }

  function answer(res, given) {
    const r = S.run; const s = r.s; const item = currentItem();
    r.ui.verdict = res; r.ui.phase = 'feedback';
    if (res.ok) s.bons += 1;
    s.reponses.push({ i: s.index, ok: res.ok, r: given == null ? null : String(given).slice(0, 200) });
    if (item.k === 'exo') {
      const x = S.exercices[item.id];
      const xs = exosByEl[x.element] || [];
      srs(x.element, res.ok, { exoIdx: Math.max(0, xs.indexOf(item.id)) });
      res.added = recordErrors(x, res);
    } else {
      srs(item.id, res.ok, item.k === 'carte' ? { dir: item.dir } : {});
    }
    saveSeance(s);
  }

  function next() {
    const r = S.run; const s = r.s;
    s.index += 1;
    if (s.index >= s.items.length) return finish();
    saveSeance(s);
    r.ui = freshUi(s.items[s.index]);
    render(true);
  }

  function finish() {
    const s = S.run.s;
    s.fin = new Date().toISOString();
    if (s.mode === 'bilan' && s.lecon) {
      const pct = Math.round((s.bons / s.items.length) * 100);
      s.score = pct;
      const l = S.lecons[s.lecon];
      if (pct >= (S.params.seuil || 80) && l && l.statut === 'faite') {
        const nl = Object.assign({}, l, { statut: 'validee', valideeLe: s.fin });
        S.lecons[s.lecon] = nl; write('lecons/' + s.lecon, nl); s.valide = true;
      }
    }
    saveSeance(s);
    S.view = 'resultats';
    render(true);
  }

  // ------------------------------------------------------------------ « Pourquoi ? »
  function regleText(el) {
    if (!el) return '';
    const lines = [];
    (el.texte || []).forEach((t) => lines.push(t));
    if (el.tableau) { lines.push(el.tableau.colonnes.join(' | ')); el.tableau.lignes.forEach((l) => lines.push(l.join(' | '))); }
    (el.exemples || []).forEach((ex) => lines.push(ex.navi + ' : ' + ex.fr));
    return lines.join('\n');
  }
  // Corps d'une règle (texte, tableau, exemples, source), commun aux fiches et à « Voir la règle ».
  function regleCorps(r) {
    let h = (r.texte || []).map((p) => '<p>' + esc(p) + '</p>').join('');
    if (r.tableau) { const nvc = new Set(r.tableau.navi || []); h += '<div class="tablebox"><table><thead><tr>' + r.tableau.colonnes.map((c) => '<th scope="col">' + esc(c) + '</th>').join('') + '</tr></thead><tbody>' + r.tableau.lignes.map((row) => '<tr>' + row.map((c, i) => '<td' + (nvc.has(i) && c && c !== '—' ? ' class="nv" lang="art-x-navi"' : '') + '>' + esc(c) + '</td>').join('') + '</tr>').join('') + '</tbody></table></div>'; }
    if (r.exemples) h += '<div>' + r.exemples.map((ex) => '<div class="ex">' + NV(ex.navi) + '<span class="small muted">' + esc(ex.fr) + '</span></div>').join('') + '</div>';
    return h + '<span class="src">Source : ' + esc(r.source) + ' · vérifié le ' + esc(frDate(r.verifie)) + '</span>';
  }
  function givenAnswer(x, ui) {
    if (!x) return ui.text || '';
    if (x.type === 'formes') { let i = 0; return x.enonce.replace(/___/g, () => x.etiquettes[ui.filled[i++]]); }
    return x.options ? (ui.pick != null ? x.options[ui.pick].t : '') : ui.text;
  }
  async function askWhy() {
    const r = S.run; const item = currentItem();
    if (item.k !== 'exo') return;
    if (!S.sample) {
      // Sans Claude (version autonome, ou appels refusés) : on affiche la règle vérifiée.
      const elId = S.exercices[item.id].element;
      r.ui.why = { regle: elId, titre: S.elements[elId].titre, state: 'done', text: '' };
      render(); return;
    }
    const x = S.exercices[item.id]; const el = S.elements[x.element]; const v = r.ui.verdict;
    const given = givenAnswer(x, r.ui);
    const prompt = [
      "Tu aides un francophone qui apprend le Na'vi. Explique en français, en 3 à 5 phrases courtes et simples, pourquoi sa réponse ne convient pas et pourquoi la réponse attendue est juste.",
      "Appuie-toi uniquement sur la règle et les exemples ci-dessous, qui ont été vérifiés. N'invente aucun mot, aucune forme ni aucune règle du Na'vi qui n'y figure pas. Si la règle ne suffit pas, dis-le simplement.",
      "Réponds en texte simple, sans titre, sans liste et sans mise en forme.",
      '', 'Règle « ' + el.titre + ' » :', regleText(el), '',
      'Exercice : ' + x.consigne + (x.enonce ? ' ' + x.enonce : '') + (x.traduction ? ' (' + x.traduction + ')' : ''),
      'Réponse attendue : ' + v.attendu,
      "Réponse de l'élève : " + given,
      x.explication ? 'Note du cours : ' + x.explication : '',
      v.msg ? 'Remarque déjà affichée : ' + v.msg : ''
    ].join('\n');
    r.ui.why = { text: '', state: 'wait', titre: el.titre };
    render();
    try {
      await S.sample(prompt, { onText: ({ text }) => { if (S.run === r) { r.ui.why.text = text; r.ui.why.state = 'stream'; updateWhy(); } } });
      if (S.run === r) { r.ui.why.state = 'done'; updateWhy(); }
    } catch (e) {
      if (S.run !== r) return;
      const msgs = { not_granted: "Tu n'as pas autorisé cette page à interroger Claude.", sampling_disabled: "Claude n'est pas disponible depuis cette page.", rate_limited: 'Trop de demandes pour le moment. Réessaie dans un instant.', session_expired: 'Ta session a expiré. Reconnecte-toi.' };
      r.ui.why.text = e && e.text ? e.text : '';
      r.ui.why.state = 'error'; r.ui.why.err = msgs[e && e.code] || "L'explication n'a pas pu être générée. Réessaie plus tard.";
      if (e && ['not_granted', 'sampling_disabled', 'not_declared', 'capability_disabled', 'capability_removed'].includes(e.code)) S.sample = null;
      render();
    }
  }
  function updateWhy() {
    const el = document.getElementById('why-text');
    const w = S.run && S.run.ui.why;
    if (el && w) el.textContent = w.text || 'Claude réfléchit…'; else render();
  }

  // ------------------------------------------------------------------ signalement
  // Version autonome (D-030) : le signalement ouvre un ticket GitHub prérempli, dans un nouvel onglet.
  function ticketGitHub(target, texte) {
    const titre = '[Signalement] ' + (target.lecon ? target.lecon + ' · ' : '') + (target.type === 'fiche' ? 'fiche de la leçon' : target.id);
    const corps = [
      '**Élément** : ' + ({ exercice: 'exercice', element: 'mot ou règle', fiche: 'fiche' }[target.type] || target.type) + ' `' + target.id + '`' + (target.lecon ? ' (leçon ' + target.lecon + ')' : ''),
      target.contexte ? '**Contexte** : ' + target.contexte : null,
      target.donnee ? '**Réponse donnée** : ' + target.donnee : null,
      target.attendu ? '**Réponse attendue** : ' + target.attendu : null,
      '', '**Remarque** :', texte || '(aucune)', '', '---', "Tinan leNa'vi, version publique " + VERSION
    ].filter((l) => l !== null).join('\n');
    const url = DEPOT + '/issues/new?title=' + encodeURIComponent(titre) + '&body=' + encodeURIComponent(corps);
    window.open(url, '_blank', 'noopener');
    toast('Le ticket s\'ouvre sur GitHub : vérifie-le, puis envoie-le.');
    return true;
  }
  const avisTicket = () => (ENV === 'autonome' ? '<p class="small muted">Le signalement s\'ouvre sur GitHub, dans un ticket public prérempli. Il faut un compte GitHub pour l\'envoyer.</p>' : '');
  async function sendReport(target) {
    const ta = document.getElementById('report-text');
    const texte = ta ? ta.value.trim() : '';
    if (ENV === 'autonome') return ticketGitHub(target, texte);
    if (!S.db) return;
    try {
      await S.db.collection('signalements').add({ cible: target.id, cibleType: target.type, lecon: target.lecon || null, contexte: target.contexte || '', texte, date: new Date().toISOString(), statut: 'ouvert' });
      toast('Signalement enregistré. Je le vérifierai avant la prochaine leçon.');
      return true;
    } catch (e) { console.warn(e); toast("Le signalement n'a pas pu être enregistré."); return false; }
  }

  // ------------------------------------------------------------------ export Markdown
  function mdTable(cols, rows) {
    const c = (s) => String(s == null ? '' : s).replace(/\|/g, '\\|');
    return ['| ' + cols.map(c).join(' | ') + ' |', '|' + cols.map(() => ' --- ').join('|') + '|'].concat(rows.map((r) => '| ' + r.map(c).join(' | ') + ' |')).join('\n');
  }
  function buildMarkdown() {
    const td = today();
    const out = ['---', 'type: export', 'app: Tinan leNa\'vi', 'date: ' + td, 'tags: [navi, app-navi]', '---', '', "# Tinan leNa'vi — fiches et progression", ''];
    doneLessons().forEach((l) => {
      out.push('## Leçon ' + l.num + ' · ' + l.titre, '');
      if (l.corrections && l.corrections.length) { out.push('> [!note] Corrections'); l.corrections.forEach((c) => out.push('> - ' + c)); out.push(''); }
      reglesOf(l.id).forEach((r) => {
        out.push('### ' + r.titre, '');
        (r.texte || []).forEach((t) => out.push(t, ''));
        if (r.tableau) out.push(mdTable(r.tableau.colonnes, r.tableau.lignes), '');
        if (r.exemples) { r.exemples.forEach((ex) => out.push('- *' + ex.navi + '* : ' + ex.fr)); out.push(''); }
        if (r.source) out.push('Source : ' + r.source + ' (vérifié le ' + r.verifie + ')', '');
      });
      const mots = motsOf(l.id);
      if (mots.length) { out.push('### Vocabulaire', '', mdTable(["Na'vi", 'Français', 'Catégorie'], mots.map((m) => [m.navi + (m.variantes ? ' (' + m.variantes.join(', ') + ')' : ''), m.fr, m.categorie])), ''); }
    });
    out.push('## Progression', '');
    out.push(mdTable(['Leçon', 'Titre', 'Statut', 'Dernier bilan'], lessonList().map((l) => { const b = lastBilan(l.id); return ['L' + l.num, l.titre, statutLabel(l.statut), b ? b.score + ' % le ' + frDate(b.fin) : '']; })), '');
    const errs = Object.keys(S.erreurs).filter((m) => S.motifs[m]);
    if (errs.length) {
      out.push('### Carnet d\'erreurs', '');
      out.push(mdTable(['Erreur', 'Statut', 'Fois', 'Réussites d\'affilée'], errs.map((m) => { const e = S.erreurs[m]; return [S.motifs[m].titre, e.statut === 'active' ? 'active' : 'maîtrisée', e.occurrences || 0, (e.serie || 0) + ' / 3']; })), '');
    }
    const done = S.seances.filter((s) => s.fin && !s.abandon).slice(0, 20);
    if (done.length) {
      out.push('### Dernières séances', '');
      out.push(mdTable(['Date', 'Type', 'Score'], done.map((s) => [frDate(s.debut), modeLabel(s), s.bons + ' / ' + s.items.length])), '');
    }
    return out.join('\n');
  }
  async function exportMd() {
    if (!S.downloads) { toast("L'export n'est pas disponible ici."); return; }
    try {
      await S.downloads.save({ filename: 'tinan-export-' + today() + '.md', data: buildMarkdown() });
      toast('Fichier exporté.');
    } catch (e) {
      if (e && e.code === 'declined') return;
      toast("L'export n'a pas abouti. Réessaie dans un instant.");
    }
  }

  // ------------------------------------------------------------------ libellés
  const statutLabel = (s) => ({ faite: 'faite', validee: 'validée', 'a-venir': 'à venir' }[s] || s);
  function modeLabel(s) {
    if (s.mode === 'jour') return 'Séance du jour';
    if (s.mode === 'bilan') return 'Bilan L' + lessonNum(s.lecon);
    if (s.mode === 'carnet') return 'Carnet d\'erreurs';
    return 'Entraînement libre';
  }
  function lastBilan(lid) { return S.seances.find((s) => s.mode === 'bilan' && s.lecon === lid && s.fin && !s.abandon); }
  function reglesOf(lid) { return Object.keys(S.elements).filter((id) => S.elements[id].lecon === lid && S.elements[id].type === 'regle').map((id) => Object.assign({ id }, S.elements[id])).sort((a, b) => (a.ordre || 0) - (b.ordre || 0)); }
  function motsOf(lid) { return Object.keys(S.elements).filter((id) => S.elements[id].lecon === lid && S.elements[id].type === 'mot').map((id) => Object.assign({ id }, S.elements[id])); }
  const plural = (n, one, many) => n + ' ' + (n > 1 ? many : one);

  function top(title, backTo) {

    else if (S.status === 'slow') html = '<div class="empty"><span class="nv">Tinan</span><p>Tes données ne répondent pas encore.</p><p class="muted small">Vérifie ta connexion. La page continue d\'attendre.</p></div>';
    else if (S.status === 'error') html = '<div class="empty"><span class="nv">Tinan</span><p>Impossible de charger tes données.</p><button class="btn-ghost" data-a="reload">Réessayer</button></div>';
    else if (S.status === 'empty') html = '<div class="empty"><span class="nv">Tinan</span><h2>Le contenu des leçons n\'est pas encore chargé</h2><p class="muted">Les fiches et les exercices arrivent après chaque leçon du cours, dans le projet Claude « Apprentissage du Na\'vi ».</p></div>';
    else {
      const v = { accueil: vAccueil, seance: vSeance, resultats: vResultats, libre: vLibre, bilan: vBilan, fiches: vFiches, carnet: vCarnet, lexique: vLexique, reglages: vReglages }[S.view] || vAccueil;
